plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fchoo.gymtracker'
version = '0.1.0'

def GARMIN_CHAQUOPY_VERSION = '17.0.0'
def GARMIN_PYTHON_VERSION = '3.13'
def GARMIN_ABI = 'arm64-v8a'

android {
  namespace "expo.modules.garminconnect"
  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '0.1.0'
    ndk {
      abiFilters GARMIN_ABI
    }
  }
}

// Chaquopy can only be applied once, to the generated Android app module.
// withGarminConnectModule.ts consumes these exact declarations when it wires
// the local module into Expo CNG.
ext.garminConnectPython = [
  chaquopyVersion: GARMIN_CHAQUOPY_VERSION,
  pythonVersion: GARMIN_PYTHON_VERSION,
  abi: GARMIN_ABI,
]
