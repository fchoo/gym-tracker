plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fchoo.gymtracker'
version = '0.1.0'

android {
  namespace "expo.modules.argon2kdf"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
  testImplementation 'junit:junit:4.13.2'
}
