appId: com.fchoo.gymtracker
name: Phase 6 production Progress and Library Search/filter evidence
tags:
  - phase-6
  - production-candidate
  - n1
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Use Full Body Foundation"
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn: "Start Full Body A"
- extendedWaitUntil:
    visible: "FOCUSED WORKOUT"
    timeout: 30000
- repeat:
    times: 12
    while:
      notVisible: "Complete Set 1"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- tapOn: "Complete Set 1"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
    timeout: 60000
- tapOn: "Expand rest controls"
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "Skip rest"
    timeout: 60000
- repeat:
    times: 12
    while:
      notVisible: "Complete Set 2"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- assertVisible: "Complete Set 2"
- tapOn: "Complete Set 2"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 3 AT 60 kg × 8"
    timeout: 60000
- tapOn: "Expand rest controls"
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "Skip rest"
    timeout: 60000
- repeat:
    times: 12
    while:
      notVisible: "Complete Set 3"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- assertVisible: "Complete Set 3"
- tapOn: "Complete Set 3"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 1 AT 42.5 kg × 10"
    timeout: 60000
- tapOn: "More workout actions"
- tapOn: "Finish as partial"
- assertVisible: "Save partial workout?"
- tapOn:
    id: "save-partial-workout-confirm"
- extendedWaitUntil:
    visible: "PARTIAL SAVED"
    timeout: 60000
- assertVisible: "PARTIAL SAVED"
- assertVisible: "Workout saved"
- stopApp
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Bench Press · Working set 1 · 3/15 working sets"
    timeout: 90000
- assertVisible: "Today"
- assertVisible: "Workout saved as partial"
- tapOn: "Progress"
- assertVisible: "4 weeks"
- assertVisible: "Overall Progress"
- scrollUntilVisible:
    element:
      text: "Working sets · 3 of 15 completed"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: "No progress history yet"
- takeScreenshot: phase6-progress-summary
- scrollUntilVisible:
    element:
      text: "Exercise progress"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "Exercise progress"
- repeat:
    times: 4
    while:
      notVisible:
        id: "progress-exercise-search-control"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- assertVisible:
    id: "progress-exercise-search-control"
- tapOn: "Search exercises"
- inputText: "Back"
- pressKey: ENTER
- assertVisible: "Search exercises"
- scrollUntilVisible:
    element:
      id: "progress-exercise-row-5f140001-7e35-4a6d-9100-000000000001-load_reps:1:1-identity"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible:
    id: "progress-exercise-row-5f140001-7e35-4a6d-9100-000000000001-load_reps:1:1-identity"
- takeScreenshot: phase6-progress-search
- tapOn: "Clear search exercises"
- pressKey: TAB
- hideKeyboard
- assertVisible: "Library"
- tapOn: "Library"
- assertVisible: "Library"
- tapOn: "Exercises"
- assertVisible: "Search exercises"
- tapOn: "Search exercises"
- inputText: "Back"
- pressKey: ENTER
- assertVisible: "Search exercises"
- takeScreenshot: phase6-library-search
- tapOn: "Clear search exercises"
- tapOn: "Favorite"
- takeScreenshot: phase6-library-favorite-selected
