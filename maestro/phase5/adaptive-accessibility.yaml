appId: com.fchoo.gymtracker
name: Phase 5 automated adaptive and large-text contract
tags:
  - phase-5
  - production-candidate
---
- launchApp:
    clearState: false
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- assertVisible: "History and data"
- tapOn: "History and data"
- assertVisible: "Data and recovery"
- tapOn:
    id: "more-data-and-recovery"
- assertVisible: "Create secure backup"
- assertVisible: "Restore backup"
- scrollUntilVisible:
    element:
      text: "Export CSV"
    direction: DOWN
    centerElement: true
- assertVisible: "Export CSV"
- assertVisible: "CSV is a readable spreadsheet file. Share it only with people you trust."
