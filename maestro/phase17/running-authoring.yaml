appId: com.fchoo.gymtracker.devtest
name: Phase 17 Running executable journeys
tags: [phase-17, native-only, development-test]
---
- launchApp: { clearState: false, stopApp: true, permissions: { notifications: deny } }
- extendedWaitUntil: { visible: "Workout", timeout: 90000 }
- tapOn: "Library"
- extendedWaitUntil: { visible: "Library section", timeout: 30000 }
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-detail'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Running plan"
      - pressKey: BACK
      - assertVisible: "Library section"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-create-zero-sessions'}"
    commands:
      - tapOn: "Create plan"
      - tapOn: "Running"
      - inputText: "Phase17 empty plan"
      - tapOn: "Save changes"
      - assertVisible: "No sessions yet"
      - pressKey: BACK
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "No sessions yet"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-goal-edit'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/edit"
      - inputText: "5000"
      - tapOn: "Save changes"
      - assertVisible: "Goal distance"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-session-common'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Recovery"
      - inputText: "30"
      - tapOn: "Save session"
      - assertVisible: "Recovery"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-recovery'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Recovery"
      - inputText: "30"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Recovery"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-long'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Long run"
      - inputText: "60"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Long run"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-progression'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Progression"
      - inputText: "45"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Progression"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-tempo'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Tempo"
      - inputText: "20"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Tempo"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-intervals'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Intervals"
      - inputText: "6"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Intervals"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-hills'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Hills"
      - inputText: "8"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Hills"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-fartlek'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Fartlek"
      - inputText: "10"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Fartlek"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-session-lifecycle'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/edit"
      - swipe: { start: "90%, 70%", end: "10%, 70%", duration: 500 }
      - tapOn: "Delete session"
      - tapOn: "Confirm"
      - tapOn: "Save changes"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "No sessions yet"
      - tapOn: "Retry loading Running plan"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-conflict'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - tapOn: "Review schedule collision"
      - tapOn: "Move Running"
      - tapOn: "Confirm"
      - tapOn: "Calendar"
      - assertVisible: "Calendar"
      - tapOn: "Today"
      - assertVisible: "Today"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-create-typed-sessions'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Recovery"
      - inputText: "30"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Long run"
      - inputText: "60"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Progression"
      - inputText: "45"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Tempo"
      - inputText: "20"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Intervals"
      - inputText: "6"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Hills"
      - inputText: "8"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/session/new"
      - tapOn: "Workout type Fartlek"
      - inputText: "10"
      - tapOn: "Save session"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Weekly structure"
- runFlow:
    when:
      true: "${PHASE17_CASE_ID == 'library.running-two-same-day-slots'}"
    commands:
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}/edit"
      - swipe: { start: "90%, 65%", end: "10%, 65%", duration: 500 }
      - tapOn: "Delete session"
      - tapOn: "Confirm"
      - tapOn: "Save changes"
      - openLink: "gymtracker-devtest:///library/running/${PHASE17_RUNNING_PLAN_ID}"
      - assertVisible: "Weekly structure"
