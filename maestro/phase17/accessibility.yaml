appId: com.fchoo.gymtracker.devtest
name: Phase 17 accessibility and recovery journey
tags:
  - phase-17
  - native-only
  - development-test
---
- assertTrue: ${PHASE17_CASE_ID == 'library.accessibility-recovery'}
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Workout"
    timeout: 90000
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Library section"
    timeout: 30000
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Center"
- pressKey: BACK
- assertVisible: "Library section"
- pressKey: BACK
- assertVisible: "Workout"
