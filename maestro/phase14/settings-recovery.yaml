appId: com.fchoo.gymtracker.devtest
name: Phase 14 settings and recovery no-write proof
tags:
  - phase-14
  - native-only
  - development-test
---
- assertTrue: ${PHASE14_STAGE == 'phase14-rest-alerts' || PHASE14_STAGE == 'phase14-settings-deep-links' || PHASE14_STAGE == 'phase14-removed-sessions' || PHASE14_STAGE == 'phase14-data-recovery' || PHASE14_STAGE == 'phase14-automatic-backup' || PHASE14_STAGE == 'phase14-manual-backup'}
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Workout"
    timeout: 90000
- openLink: "gymtracker-devtest:///more/data-and-recovery?suite=phase14&phase14Stage=${PHASE14_STAGE}"
- extendedWaitUntil:
    visible: "Data and recovery"
    timeout: 30000
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-rest-alerts'}
    commands:
      - pressKey: BACK
      - assertVisible: "Workout"
      - tapOn: "Open App Settings"
      - extendedWaitUntil:
          visible: "App Settings"
          timeout: 30000
      - assertVisible: "Rest alerts"
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-settings-deep-links'}
    commands:
      - assertVisible: "Data and recovery"
      - pressKey: BACK
      - assertVisible: "Workout"
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-removed-sessions'}
    commands:
      - pressKey: BACK
      - assertVisible: "Workout"
      - tapOn: "Open App Settings"
      - extendedWaitUntil:
          visible: "App Settings"
          timeout: 30000
      - scrollUntilVisible:
          element:
            text: "Removed sessions"
      - assertVisible: "Removed sessions"
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-data-recovery'}
    commands:
      - assertVisible: "Manual encrypted backup"
      - tapOn: "Manual encrypted backup"
      - extendedWaitUntil:
          visible: "Manual encrypted backup"
          timeout: 30000
      - scrollUntilVisible:
          element:
            text: "Restore clean"
      - assertVisible: "Restore clean"
      - tapOn: "Restore password"
      - inputText: "phase14-cancel-only"
      - tapOn:
          id: "restore-clean-action"
      - extendedWaitUntil:
          visible: "No backup was selected"
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-automatic-backup'}
    commands:
      - assertVisible: "Automatic backup"
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-manual-backup'}
    commands:
      - assertVisible: "Manual encrypted backup"
