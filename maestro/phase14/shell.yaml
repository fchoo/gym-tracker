appId: com.fchoo.gymtracker.devtest
name: Phase 14 shell roots, theme, and startup proof
tags:
  - phase-14
  - native-only
  - development-test
---
- assertTrue: ${PHASE14_STAGE == 'phase14-four-roots' || PHASE14_STAGE == 'phase14-root-state' || PHASE14_STAGE == 'phase14-appearance' || PHASE14_STAGE == 'phase14-tokens'}
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Workout"
    timeout: 90000
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-four-roots'}
    commands:
      - assertVisible: "Workout"
      - tapOn: "Calendar"
      - assertVisible: "Calendar"
      - tapOn: "Library"
      - assertVisible: "Library"
      - tapOn: "Progress"
      - assertVisible: "Progress"
      - tapOn: "Workout"
      - assertVisible: "Workout"
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-root-state'}
    commands:
      - tapOn: "Library"
      - assertVisible: "Library"
      - pressKey: BACK
      - assertVisible: "Workout"
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-appearance'}
    commands:
      - tapOn: "Open App Settings"
      - extendedWaitUntil:
          visible: "App Settings"
          timeout: 30000
      - assertVisible: "Appearance"
      - runFlow:
          when:
            true: ${PHASE14_THEME_OPTION == 'Light'}
          commands:
            - tapOn: "Light"
            - assertVisible: "Light"
      - runFlow:
          when:
            true: ${PHASE14_THEME_OPTION == 'Dark'}
          commands:
            - tapOn: "Dark"
            - assertVisible: "Dark"
      - runFlow:
          when:
            true: ${PHASE14_THEME_OPTION == 'System'}
          commands:
            - tapOn: "System"
            - assertVisible: "System"
      - pressKey: BACK
      - assertVisible: "Workout"
      - tapOn: "Calendar"
      - assertVisible: "Calendar"
      - tapOn: "Open App Settings"
      - extendedWaitUntil:
          visible: "App Settings"
          timeout: 30000
      - pressKey: BACK
      - assertVisible: "Calendar"
      - tapOn: "Library"
      - assertVisible: "Library"
      - tapOn: "Open App Settings"
      - extendedWaitUntil:
          visible: "App Settings"
          timeout: 30000
      - pressKey: BACK
      - assertVisible: "Library"
      - tapOn: "Progress"
      - assertVisible: "Progress"
      - tapOn: "Open App Settings"
      - extendedWaitUntil:
          visible: "App Settings"
          timeout: 30000
      - pressKey: BACK
      - assertVisible: "Progress"
- runFlow:
    when:
      true: ${PHASE14_STAGE == 'phase14-tokens'}
    commands:
      - assertVisible: "Workout"
      - assertVisible: "Calendar"
      - assertVisible: "Library"
      - assertVisible: "Progress"
