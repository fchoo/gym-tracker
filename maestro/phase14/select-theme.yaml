appId: com.fchoo.gymtracker.devtest
name: Phase 14 explicit appearance selection
tags:
  - phase-14
  - native-only
---
- tapOn: "Open App Settings"
- extendedWaitUntil:
    visible: "App Settings"
    timeout: 30000
- assertVisible: "Appearance"
- scrollUntilVisible:
    element:
      text: ${PHASE14_THEME_OPTION}
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ${PHASE14_THEME_OPTION}
- assertVisible: ${PHASE14_THEME_OPTION}
- pressKey: BACK
- extendedWaitUntil:
    visible: "Workout"
    timeout: 30000
