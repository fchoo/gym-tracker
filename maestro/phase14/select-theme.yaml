appId: com.fchoo.gymtracker.devtest
name: Phase 14 explicit appearance selection
tags:
  - phase-14
  - native-only
---
- tapOn: "Open App Settings"
- extendedWaitUntil:
    visible: "App Settings"
    timeout: 30000
- assertVisible: "Appearance"
- runFlow:
    when:
      true: ${PHASE14_COMPACT_LANDSCAPE != 'true'}
    commands:
      - scrollUntilVisible:
          element:
            text: ${PHASE14_THEME_OPTION}
          direction: DOWN
          centerElement: true
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE14_COMPACT_LANDSCAPE == 'true'}
    commands:
      - pressKey: "Remote Dpad Down"
      - runFlow:
          when:
            true: ${PHASE14_THEME_OPTION == 'Light'}
          commands:
            - pressKey: "Remote Dpad Down"
      - runFlow:
          when:
            true: ${PHASE14_THEME_OPTION == 'Dark'}
          commands:
            - pressKey: "Remote Dpad Down"
            - pressKey: "Remote Dpad Down"
- extendedWaitUntil:
    visible: ${PHASE14_THEME_OPTION}
    timeout: 30000
- tapOn: ${PHASE14_THEME_OPTION}
- assertVisible: "App Settings"
- pressKey: BACK
- extendedWaitUntil:
    visible: "Workout"
    timeout: 30000
