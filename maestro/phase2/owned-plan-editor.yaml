appId: com.fchoo.gymtracker.devtest
name: Phase 2 installed owned plan create save duplicate archive restore
tags:
  - phase-2
  - library
  - owned-plans
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Library"
- scrollUntilVisible:
    element:
      text: "My Plans"
    direction: DOWN
    centerElement: true
- assertVisible: "My Plans"
- scrollUntilVisible:
    element:
      text: "Create my own"
    direction: UP
    centerElement: true
- tapOn: "Create my own"
- assertVisible: "Create my own"
- tapOn: "Plan name"
- inputText: "Maestro Strength"
- tapOn: "First day name"
- inputText: "Strength Day"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Create draft"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "Create draft"
- extendedWaitUntil:
    visible: "Draft"
    timeout: 60000
- assertVisible: "Add at least one exercise with valid targets before scheduling or activating."
- assertVisible: "Schedule and Activate are unavailable. Add at least one exercise with valid targets before scheduling or activating."
- assertNotVisible: "Delete plan"
- scrollUntilVisible:
    element:
      id: "owned-plan-add-exercise"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "owned-plan-add-exercise"
- scrollUntilVisible:
    element:
      id: "owned-plan-exercise-search"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "owned-plan-exercise-search"
- inputText: "Back Squat"
- hideKeyboard
- tapOn:
    text: "Back Squat.*Load . reps"
- tapOn: "Working sets"
- eraseText: 1
- inputText: "2"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Load (kg)"
    direction: DOWN
    centerElement: true
- tapOn: "Load (kg)"
- eraseText: 1
- inputText: "20"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Minimum reps"
    direction: DOWN
    centerElement: true
- tapOn: "Minimum reps"
- eraseText: 1
- inputText: "8"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Maximum reps"
    direction: DOWN
    centerElement: true
- tapOn: "Maximum reps"
- eraseText: 2
- inputText: "12"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Rest (seconds)"
    direction: DOWN
    centerElement: true
- tapOn: "Rest (seconds)"
- eraseText: 2
- inputText: "90"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Save target"
    direction: DOWN
- tapOn: "Save target"
- assertVisible: "2 working sets · 20 kg · 8–12 reps"
- tapOn: "Save day"
- assertVisible: "Strength Day saved to draft"
- scrollUntilVisible:
    element:
      text: "Schedule and Activate are unavailable. Add at least one exercise with valid targets before scheduling or activating."
    direction: UP
    centerElement: true
- assertVisible: "Schedule and Activate are unavailable. Add at least one exercise with valid targets before scheduling or activating."
- scrollUntilVisible:
    element:
      id: "owned-plan-add-exercise"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "owned-plan-add-exercise"
- scrollUntilVisible:
    element:
      id: "owned-plan-exercise-search"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "owned-plan-exercise-search"
- inputText: "Bench Press"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Barbell Bench Press - Medium Grip.*Load . reps"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Barbell Bench Press - Medium Grip.*Load . reps"
- scrollUntilVisible:
    element:
      text: "Save target"
    direction: DOWN
- tapOn: "Save target"
- assertVisible: "Barbell Bench Press - Medium Grip"
- scrollUntilVisible:
    element:
      id: "drag-exercise-Barbell Bench Press - Medium Grip"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Reorder Barbell Bench Press - Medium Grip"
- assertVisible: "Reorder Back Squat"
