appId: com.fchoo.gymtracker.devtest
name: Phase 2 installed schedule actions overrides timezone and cross-profile workout
tags:
  - phase-2
  - schedule
  - today
  - cross-profile
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Library"
- scrollUntilVisible:
    element:
      text: "Push / Pull / Legs"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Push / Pull / Legs. 3 days per week.*"
- assertVisible: "Push / Pull / Legs"
- scrollUntilVisible:
    element:
      text: "Activate plan"
    direction: DOWN
- tapOn: "Activate plan"
- assertVisible: "Activate Push / Pull / Legs"
- tapOn: "Start date"
- assertVisible: "Calendar dialog"
- tapOn: "Previous month"
- tapOn:
    text: "^Select [0-9]{4}-[0-9]{2}-01$"
- tapOn: "Apply Date"
- assertNotVisible: "Calendar dialog"
- assertVisible: "Rotation"
- scrollUntilVisible:
    element:
      text: "Activate plan"
    direction: DOWN
- tapOn: "Activate plan"
- assertVisible: "Activate Push / Pull / Legs?"
- tapOn: "Activate plan"
- assertVisible: "Push / Pull / Legs is active"
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "^(Choose another day|Train anyway)$"
