- tapOn: "Schedule"
- assertVisible: "Edit schedule"
- assertVisible: "Before"
- assertVisible: "After"
- assertVisible: "Effective date"
- assertVisible: "Schedule timezone"
- tapOn: "Effective date"
- assertVisible: "Calendar dialog"
- tapOn: "Use Default Date"
- tapOn: "Apply Date"
- assertNotVisible: "Calendar dialog"
- tapOn: "Schedule timezone"
- eraseText: 32
- inputText: "Australia/Sydney"
- hideKeyboard
- repeat:
    times: 4
    while:
      notVisible: "^Weekday$"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 45%
          duration: 300
- assertVisible: "^Weekday$"
- tapOn: "^Rotation$"
- assertVisible: "Push"
- assertVisible: "Pull"
- assertVisible: "Legs"
- assertVisible: "Reorder Pull"
- assertVisible: "Reorder Push"
- repeat:
