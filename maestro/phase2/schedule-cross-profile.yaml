- waitForAnimationToEnd
- assertVisible: "Pull"
- tapOn: "Advance"
- assertVisible: "Advance Pull?"
- tapOn: "Advance"
- extendedWaitUntil:
    visible: "Rest day"
    timeout: 30000
- assertVisible: "Next scheduled workout · Push · .*"
- tapOn: "Library"
- scrollUntilVisible:
