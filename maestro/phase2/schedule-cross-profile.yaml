          start: 95%, 75%
          end: 95%, 45%
          duration: 300
- assertVisible: "Save schedule"
- tapOn: "Save schedule"
- assertVisible: "Save this schedule?"
- tapOn: "Save schedule"
- extendedWaitUntil:
    visible: "Save Plan Changes"
    timeout: 30000
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: deny
