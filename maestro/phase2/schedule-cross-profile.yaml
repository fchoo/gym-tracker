appId: com.fchoo.gymtracker.devtest
name: Phase 2 installed schedule actions overrides timezone and cross-profile workout
tags:
  - phase-2
  - schedule
  - today
  - cross-profile
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Library"
- scrollUntilVisible:
    element:
      text: "Push / Pull / Legs"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Push / Pull / Legs. 3 days per week.*"
- assertVisible: "Push / Pull / Legs"
- scrollUntilVisible:
    element:
      text: "Activate plan"
    direction: DOWN
- tapOn: "Activate plan"
- assertVisible: "Activate Push / Pull / Legs"
- tapOn: "Start date"
- assertVisible: "Calendar dialog"
- tapOn: "Previous month"
- tapOn:
    text: "^Select [0-9]{4}-[0-9]{2}-01$"
- tapOn: "Apply Date"
- assertNotVisible: "Calendar dialog"
- assertVisible: "Rotation"
- scrollUntilVisible:
    element:
      text: "Activate plan"
    direction: DOWN
- tapOn: "Activate plan"
- assertVisible: "Activate Push / Pull / Legs?"
- tapOn: "Activate plan"
- assertVisible: "Push / Pull / Legs is active"
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "^(Choose another day|Train anyway)$"
    timeout: 90000
- tapOn: "Library"
- scrollUntilVisible:
    element:
      text: "Active Plan"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      text: "Push / Pull / Legs"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Push / Pull / Legs. Active.*"
- scrollUntilVisible:
    element:
      text: "Schedule"
    direction: DOWN
    centerElement: true
- tapOn: "Schedule"
- assertVisible: "Edit schedule"
- assertVisible: "Before"
- assertVisible: "After"
- assertVisible: "Effective date"
- assertVisible: "Schedule timezone"
- tapOn: "Effective date"
- assertVisible: "Calendar dialog"
- tapOn: "Use Default Date"
- tapOn: "Apply Date"
- assertNotVisible: "Calendar dialog"
- tapOn: "Schedule timezone"
- eraseText: 32
- inputText: "Australia/Sydney"
- hideKeyboard
- repeat:
    times: 4
    while:
      notVisible: "^Weekday$"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 45%
          duration: 300
- assertVisible: "^Weekday$"
- tapOn: "^Rotation$"
- assertVisible: "1. Push"
- assertVisible: "2. Pull"
- repeat:
    times: 4
    while:
      notVisible: "Move Pull up"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 45%
          duration: 300
- assertVisible: "Move Pull up"
- tapOn: "Move Pull up"
- assertVisible: "1. Pull"
- repeat:
    times: 4
    while:
      notVisible: "3. Legs"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 45%
          duration: 300
- assertVisible: "3. Legs"
- repeat:
    times: 4
    while:
      notVisible: "Save schedule"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 45%
          duration: 300
- assertVisible: "Save schedule"
- tapOn: "Save schedule"
- assertVisible: "Save this schedule?"
- tapOn: "Save schedule"
- extendedWaitUntil:
    visible: "Save Plan Changes"
    timeout: 30000
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: deny
- assertVisible: "Today"
- assertVisible: "Device timezone changed"
