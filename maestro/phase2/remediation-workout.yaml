      text: "Add working set"
    direction: DOWN
    centerElement: true
- assertVisible: "Add working set"
- assertNotVisible: "Excluded from records and progression"
- openLink: "gymtracker-devtest://__notification-test-controls?action=arm_add_warmup_failure"
- assertVisible: "Add warm-up failure armed"
- repeat:
    times: 12
    while:
      notVisible: "Return to Today"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- swipe:
    start: 95%, 75%
    end: 95%, 45%
    duration: 300
- assertVisible: "Return to Today"
- tapOn: "Return to Today"
