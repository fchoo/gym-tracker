    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Use Full Body Foundation"
- tapOn: "Activate Full Body Foundation"
- runFlow: "../subflows/phase1-start-full-body-a.yaml"
- assertVisible: "FOCUSED WORKOUT"
- assertVisible: "Back Squat"
- assertVisible: "Today's plan"
- assertVisible: "Add warm-up"
- assertVisible: "Copy previous warm-up"
- scrollUntilVisible:
