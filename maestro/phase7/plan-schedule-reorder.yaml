appId: com.fchoo.gymtracker
name: Phase 7 production plan schedule reorder evidence
tags:
  - phase-7
  - production-candidate
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- tapOn: "Library"
- scrollUntilVisible:
    element:
      text: "My Plans"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      text: "Create my own"
    direction: UP
    centerElement: true
- tapOn: "Create my own"
- tapOn: "Plan name"
- inputText: "Phase Seven Reorder"
- tapOn: "First day name"
- inputText: "First"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Create draft"
    direction: DOWN
    centerElement: true
- tapOn: "Create draft"
- extendedWaitUntil:
    visible: "Draft"
    timeout: 60000
- assertVisible: "Plan days"
- takeScreenshot: phase7-plan-selected-day
- scrollUntilVisible:
    element:
      id: "drag-exercise-Back Squat"
    direction: DOWN
    centerElement: true
- assertVisible: "Reorder Back Squat"
- takeScreenshot: phase7-plan-drag-handle
- scrollUntilVisible:
    element:
      id: "owned-plan-add-exercise"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "owned-plan-add-exercise"
- tapOn:
    id: "owned-plan-exercise-search"
- inputText: "Bench Press"
- hideKeyboard
- tapOn:
    text: "Bench Press.*Load . reps"
- scrollUntilVisible:
    element:
      text: "Save target"
    direction: DOWN
    centerElement: true
- tapOn: "Save target"
- scrollUntilVisible:
    element:
      id: "drag-exercise-Bench Press"
    direction: DOWN
    centerElement: true
- assertVisible: "Reorder Bench Press"
- assertVisible: "Reorder Back Squat"
