appId: com.fchoo.gymtracker
name: Phase 7 production workout removal and countdown sound evidence
tags:
  - phase-7
  - production-candidate
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Use Full Body Foundation"
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn: "Start Full Body A"
- extendedWaitUntil:
    visible: "FOCUSED WORKOUT"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Remove warm-up W1"
    direction: DOWN
    centerElement: true
- takeScreenshot: phase7-workout-set-row
- tapOn: "Remove warm-up W1"
- assertVisible: "Remove warm-up"
- takeScreenshot: phase7-workout-remove-confirmation
- tapOn:
    id: "remove-warmup-confirm"
- extendedWaitUntil:
    visible: "Warm-up W1 removed"
    timeout: 60000
- assertNotVisible: "Remove warm-up W1"
- repeat:
    times: 32
    while:
      notVisible: "Complete Set 1"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 500
- assertVisible: "Complete Set 1"
- tapOn: "Complete Set 1"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
    timeout: 60000
- extendedWaitUntil:
    visible: "Rest ended"
    timeout: 240000
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: deny
- assertVisible: "Today"
- tapOn: "Settings"
- assertVisible: "Rest sound"
- takeScreenshot: phase7-workout-audio-settings
