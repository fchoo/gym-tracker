appId: com.fchoo.gymtracker
name: Phase 7 production workout removal and countdown sound evidence
tags:
  - phase-7
  - production-candidate
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Use Full Body Foundation"
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn: "Start Full Body A"
- extendedWaitUntil:
    visible: "FOCUSED WORKOUT"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Remove warm-up W1"
    direction: DOWN
    centerElement: true
- takeScreenshot: phase7-workout-set-row
- tapOn: "Remove warm-up W1"
- assertVisible: "Remove warm-up"
- takeScreenshot: phase7-workout-remove-confirmation
- tapOn: "Cancel"
- tapOn: "Open Settings"
- assertVisible: "Rest sound"
- takeScreenshot: phase7-workout-audio-settings
