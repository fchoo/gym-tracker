appId: com.fchoo.gymtracker.devtest
name: Phase 1 airplane workout session
---
- assertVisible: "Today"
- runFlow: "phase1-start-full-body-a.yaml"
- assertVisible: "Back Squat"
- repeat:
    times: 2
    commands:
      - scrollUntilVisible:
          element:
            text: "Remove warm-up W1"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Remove warm-up W1"
      - assertVisible: "Remove warm-up W1?"
      - tapOn:
          id: "remove-warmup-confirm"
      - extendedWaitUntil:
          notVisible:
            id: "remove-warmup-confirm"
          timeout: 60000
- repeat:
    times: 12
    while:
      notVisible: "Complete Set 1"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- assertVisible: "Complete Set 1"
- tapOn: "Complete Set 1"
- tapOn:
    text: "Don’t allow"
    optional: true
- assertVisible: "Expand rest controls"
- tapOn: "Expand rest controls"
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "Skip rest"
    timeout: 60000
- repeat:
    times: 2
    commands:
      - scrollUntilVisible:
          element:
            text: "Remove set 2"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Remove set 2"
      - assertVisible: "Remove set 2?"
      - tapOn:
          id: "remove-working-set-confirm"
      - extendedWaitUntil:
          notVisible:
            id: "remove-working-set-confirm"
          timeout: 60000
- assertVisible: "Bench Press"
- repeat:
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            text: "Remove set 1"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Remove set 1"
      - assertVisible: "Remove set 1?"
      - tapOn:
          id: "remove-working-set-confirm"
      - extendedWaitUntil:
          notVisible:
            id: "remove-working-set-confirm"
          timeout: 60000
- assertVisible: "Lat Pulldown"
- repeat:
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            text: "Remove set 1"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Remove set 1"
      - assertVisible: "Remove set 1?"
      - tapOn:
          id: "remove-working-set-confirm"
      - extendedWaitUntil:
          notVisible:
            id: "remove-working-set-confirm"
          timeout: 60000
- assertVisible: "Romanian Deadlift"
- repeat:
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            text: "Remove set 1"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Remove set 1"
      - assertVisible: "Remove set 1?"
      - tapOn:
          id: "remove-working-set-confirm"
      - extendedWaitUntil:
          notVisible:
            id: "remove-working-set-confirm"
          timeout: 60000
- assertVisible: "Plank"
- repeat:
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            text: "Remove set 1"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Remove set 1"
      - assertVisible: "Remove set 1?"
      - tapOn:
          id: "remove-working-set-confirm"
      - extendedWaitUntil:
          notVisible:
            id: "remove-working-set-confirm"
          timeout: 60000
- scrollUntilVisible:
    element:
      text: "More workout actions"
    direction: UP
    centerElement: true
    timeout: 60000
- tapOn: "More workout actions"
- scrollUntilVisible:
    element:
      text: "Finish workout"
    direction: UP
    centerElement: true
- assertVisible: "Finish workout"
- tapOn: "Finish workout"
- assertVisible: "Workout complete"
- repeat:
    times: 12
    while:
      notVisible: "Return to Today"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- assertVisible: "Return to Today"
- tapOn: "Return to Today"
- assertVisible: "Today"
