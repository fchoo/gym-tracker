appId: com.fchoo.gymtracker.devtest
name: Phase 10 advanced set timing tracer
tags:
  - phase-10
  - advanced-timing
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Choose your starting plan"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "Use Full Body Foundation"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Use Full Body Foundation"
- scrollUntilVisible:
    element:
      text: "Activate Full Body Foundation"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn:
    text: "Start Full Body A"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "WORKOUT OVERVIEW"
    timeout: 30000
- assertVisible: "Per-rep cadence"
- assertVisible: "Per-rep interval in seconds"
- tapOn:
    id: "advanced-timing-interval-seconds"
- eraseText: 1
- inputText: "1"
- tapOn: "Configure and start per-rep cadence"
- extendedWaitUntil:
    visible: "Pause per-rep cadence"
    timeout: 30000
- extendedWaitUntil:
    visible: "Rep 2"
    timeout: 30000
- tapOn: "Pause per-rep cadence"
- extendedWaitUntil:
    visible: "Resume per-rep cadence"
    timeout: 30000
- tapOn: "Resume per-rep cadence"
- extendedWaitUntil:
    visible: "Pause per-rep cadence"
    timeout: 30000
- tapOn: "Stop per-rep cadence"
- extendedWaitUntil:
    visible: "Configure and start per-rep cadence"
    timeout: 30000
- tapOn: "Configure and start per-rep cadence"
- extendedWaitUntil:
    visible: "Pause per-rep cadence"
    timeout: 30000
- stopApp
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 90000
- tapOn: "Resume workout"
- assertVisible: "WORKOUT OVERVIEW"
- assertVisible: "Per-rep cadence"
- assertVisible: "Pause per-rep cadence"
- assertVisible: "Complete Set 1"
- tapOn: "Complete Set 1"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
    timeout: 60000
