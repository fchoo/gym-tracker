appId: com.fchoo.gymtracker
name: Phase 8 session overview tracer
tags:
  - phase-8
  - session-overview
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Use Full Body Foundation"
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn: "Start Full Body A"
- extendedWaitUntil:
    visible: "WORKOUT OVERVIEW"
    timeout: 30000
- pressKey: TAB
- pressKey: ENTER
- assertVisible: "Back Squat"
- assertVisible: "Bench Press"
- tapOn: "Back Squat. Completed. 2 of 2 working sets. Expand exercise"
- assertVisible: "Working sets"
- tapOn: "Back Squat. Completed. 2 of 2 working sets. Collapse exercise"
- tapOn: "Set 2. 60 kg × 8. Not completed. Expand set editor"
- assertVisible: "Complete Set 2"
- repeat:
    times: 12
    while:
      notVisible: "Complete Set 1"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 25%
          duration: 300
- assertVisible: "Complete Set 1"
- tapOn: "Complete Set 1"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
    timeout: 60000
- stopApp
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 90000
- tapOn: "Resume workout"
- assertVisible: "WORKOUT OVERVIEW"
- assertVisible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
- pressKey: TAB
- pressKey: ENTER
- assertVisible: "Complete Set 2"
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn: "Choose another day"
- tapOn: "Start empty workout"
- extendedWaitUntil:
    visible: "Empty workout in progress"
    timeout: 30000
- assertVisible: "WORKOUT OVERVIEW"
- assertVisible: "Add exercise. Available in Phase 9."
- assertNotVisible: "Working sets"
- tapOn: "Save zero-set workout"
- assertVisible: "Finish without working sets?"
- assertVisible: "This workout will be saved with zero completed working sets."
- tapOn: "Keep training"
