appId: com.fchoo.gymtracker
name: Phase 8 session overview tracer
tags:
  - phase-8
  - session-overview
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Use Full Body Foundation"
    timeout: 90000
- tapOn: "Use Full Body Foundation"
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn: "Start Full Body A"
- extendedWaitUntil:
    visible: "WORKOUT OVERVIEW"
    timeout: 30000
- assertVisible: "Back Squat"
- assertVisible: "Bench Press"
- tapOn: "Back Squat. Completed. 2 of 2 working sets. Expand exercise"
- assertVisible: "Working sets"
- tapOn: "Back Squat. Completed. 2 of 2 working sets. Collapse exercise"
- tapOn: "Set 2. 60 kg × 8. Not completed. Expand set editor"
- assertVisible: "Complete Set 2"
- scrollUntilVisible:
    element:
      text: "Complete Set 1"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Complete Set 1"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
    timeout: 60000
- assertVisible: "Complete Set 2"
