appId: com.fchoo.gymtracker.devtest
name: Phase 8 session overview tracer
tags:
  - phase-8
  - session-overview
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Choose your starting plan"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "Use Full Body Foundation"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Use Full Body Foundation"
- scrollUntilVisible:
    element:
      text: "Activate Full Body Foundation"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn: "Start Full Body A"
- extendedWaitUntil:
    visible: "WORKOUT OVERVIEW"
    timeout: 30000
- pressKey: TAB
- pressKey: ENTER
- assertVisible: "Working set 1 load in kilograms"
- repeat:
    times: 4
    while:
      notVisible: "Bench Press"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 40%
          duration: 300
- assertVisible: "Bench Press"
- repeat:
    times: 4
    while:
      notVisible: "Warm-up W1"
    commands:
      - swipe:
          start: 95%, 40%
          end: 95%, 75%
          duration: 300
- assertVisible: "Warm-up W1"
- repeat:
    times: 12
    while:
      notVisible: "Complete Set 1"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 40%
          duration: 300
- assertVisible: "Complete Set 1"
- tapOn: "Complete Set 1"
- extendedWaitUntil:
    visible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
    timeout: 60000
- stopApp
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 90000
- tapOn: "Resume workout"
- assertVisible: "WORKOUT OVERVIEW"
- assertVisible: "RESTING · NEXT: SET 2 AT 60 kg × 8"
- assertVisible: "Expand rest controls"
- tapOn: "Expand rest controls"
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "Skip rest"
    timeout: 60000
- repeat:
    times: 12
    while:
      notVisible: "Complete Set 2"
    commands:
      - swipe:
          start: 95%, 75%
          end: 95%, 40%
          duration: 300
- assertVisible: "Complete Set 2"
- tapOn: "More workout actions"
- scrollUntilVisible:
    element:
      text: "Discard workout"
    direction: DOWN
    centerElement: true
- tapOn: "Discard workout"
- assertVisible: "Discard workout?"
- tapOn:
    id: "discard-workout-confirm"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- extendedWaitUntil:
    visible: "Train anyway"
    timeout: 30000
- tapOn: "Train anyway"
- tapOn: "Start empty workout"
- extendedWaitUntil:
    visible: "Empty workout in progress"
    timeout: 30000
- assertVisible: "WORKOUT OVERVIEW"
- assertVisible: "Add exercise. Available in Phase 9."
- assertNotVisible: "Working sets"
- tapOn: "Save zero-set workout"
- assertVisible: "Finish without working sets?"
- assertVisible: "This workout will be saved with zero completed working sets."
- tapOn: "Keep training"
