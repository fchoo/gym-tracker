appId: com.fchoo.gymtracker.devtest
name: Phase 9 add exercise and relaunch persistence
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- assertVisible: "Today"
- extendedWaitUntil:
    visible: "Choose your starting plan"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "Use Full Body Foundation"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Use Full Body Foundation"
- scrollUntilVisible:
    element:
      text: "Activate Full Body Foundation"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Activate Full Body Foundation"
- extendedWaitUntil:
    visible: "^(Start Full Body A|Start Full Body B|Rest day)$"
    timeout: 90000
- runFlow:
    when:
      visible: "Start Full Body B"
    commands:
      - tapOn: "Choose another day"
- runFlow:
    when:
      visible: "Rest day"
    commands:
      - tapOn: "Train anyway"
- tapOn: "Start empty workout"
- extendedWaitUntil:
    visible: "WORKOUT OVERVIEW"
    timeout: 30000
- assertVisible: "Add exercise"
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: "Squat"
- tapOn: ".*Add exercise"
- pressKey: Back
- scrollUntilVisible:
    element:
      text: "Add Back Squat"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Add Back Squat"
- assertVisible: '^Back Squat\. Added\. 0 of 1 working sets\. Collapse exercise$'
- assertVisible: '^Working sets$'
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: deny
- assertVisible: '^Back Squat · Working set 1 · Rest idle$'
- openLink: "gymtracker-devtest://__notification-test-controls?action=arm_replace_exercise_failure"
- extendedWaitUntil:
    visible: "Replace exercise failure armed"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Return to Today"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Return to Today"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 30000
- tapOn: "Resume workout"
- extendedWaitUntil:
    visible: "WORKOUT OVERVIEW"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Back Squat exercise actions"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Back Squat exercise actions"
- tapOn: "Replace exercise"
- assertVisible: "Choose exercise"
- tapOn: "Search exercises"
- inputText: "Bench Press"
- tapOn:
    id: "replace-exercise-option-5f140001-7e35-4a6d-9100-000000000002"
- pressKey: Back
- scrollUntilVisible:
    element:
      text: "Replace with Bench Press"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Replace with Bench Press"
- extendedWaitUntil:
    visible: "Retry replacing exercise"
    timeout: 30000
- tapOn: "Retry replacing exercise"
- extendedWaitUntil:
    visible: "Bench Press"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Complete Set 1"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Complete Set 1"
- tapOn: "Complete Set 1"
- openLink: "gymtracker-devtest://__notification-test-controls?action=arm_remove_exercise_failure"
- extendedWaitUntil:
    visible: "Remove exercise failure armed"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Return to Today"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Return to Today"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 30000
- tapOn: "Resume workout"
- extendedWaitUntil:
    visible: "WORKOUT OVERVIEW"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Bench Press exercise actions"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Bench Press exercise actions"
- tapOn: "Remove exercise"
- assertVisible: "This exercise has completed sets. They will be retained and this exercise will be marked Skipped, not deleted."
- tapOn: "Keep exercise"
- tapOn: "Bench Press exercise actions"
- tapOn: "Remove exercise"
- tapOn:
    id: "remove-exercise-confirm"
- extendedWaitUntil:
    visible: "Retry removing exercise"
    timeout: 30000
- tapOn: "Retry removing exercise"
- extendedWaitUntil:
    visible: 'Skipped · 1 of 1 working sets'
    timeout: 30000
- assertVisible: "Completed · 0 kg × 8"
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: deny
- assertVisible: '^Bench Press · Working set 1 · Rest idle$'
- assertVisible: 'Skipped · 1 of 1 working sets'
- assertVisible: "Completed · 0 kg × 8"
