appId: com.fchoo.gymtracker.devtest
name: V1.2 real SQLite recovery cut and retry
tags: [phase-20, recovery, development-test, real-sqlite]
---
- assertTrue: ${V12_RECOVERY_CASE != null}
- assertTrue: ${V12_RECOVERY_STAGE != null}
- assertTrue: ${V12_RECOVERY_STEP != null}
- assertTrue: ${V12_DOMAIN_NONCE != null}
- assertTrue: ${V12_RECOVERY_PHASE == 'arm' || V12_RECOVERY_PHASE == 'recover'}
- runFlow:
    when: { true: "${V12_RECOVERY_PHASE == 'arm'}" }
    commands:
      - launchApp: { clearState: false, stopApp: true }
      - extendedWaitUntil:
          visible: { id: "root-navigation-bottom" }
          timeout: 20000
      - openLink: "gymtracker-devtest://__v12-production-recovery?nonce=${V12_DOMAIN_NONCE}&caseId=${V12_RECOVERY_CASE}&stepId=${V12_RECOVERY_STEP}&cutId=${V12_RECOVERY_STAGE}&phase=arm"
      - extendedWaitUntil:
          visible: "Recovery cut armed"
          timeout: 120000
- runFlow:
    when: { true: "${V12_RECOVERY_PHASE == 'recover'}" }
    commands:
      - launchApp: { clearState: false, stopApp: false }
      - extendedWaitUntil:
          visible: { id: "root-navigation-bottom" }
          timeout: 20000
      - openLink: "gymtracker-devtest://__v12-production-recovery?nonce=${V12_DOMAIN_NONCE}&caseId=${V12_RECOVERY_CASE}&stepId=${V12_RECOVERY_STEP}&cutId=${V12_RECOVERY_STAGE}&phase=recover"
      - extendedWaitUntil:
          visible: "Recovery observation complete"
          timeout: 120000
