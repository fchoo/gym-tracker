appId: com.fchoo.gymtracker.devtest
name: V1.2 real SQLite recovery cut and retry
tags: [phase-20, recovery, development-test, real-sqlite]
---
- assertTrue: ${V12_RECOVERY_CASE != null}
- assertTrue: ${V12_RECOVERY_STAGE != null}
- assertTrue: ${V12_DOMAIN_NONCE != null}
- launchApp: { clearState: false, stopApp: true }
- openLink: "gymtracker-devtest://__v12-production-recovery?nonce=${V12_DOMAIN_NONCE}&caseId=${V12_RECOVERY_CASE}&cutId=${V12_RECOVERY_STAGE}&phase=arm"
- extendedWaitUntil:
    visible: "Recovery cut armed"
    timeout: 120000
# This stop is the real process boundary. The arm route has already closed its
# writer, and no final marker exists until a fresh process reopens and retries.
- stopApp
- launchApp: { clearState: false, stopApp: true }
- openLink: "gymtracker-devtest://__v12-production-recovery?nonce=${V12_DOMAIN_NONCE}&caseId=${V12_RECOVERY_CASE}&cutId=${V12_RECOVERY_STAGE}&phase=recover"
- extendedWaitUntil:
    visible: "Recovery observation complete"
    timeout: 120000
