appId: com.fchoo.gymtracker.devtest
name: Phase 16 Calendar diagnostic trace contract
tags: [calendar-tracer, native-only, development-test, phase-16]
---
- assertTrue: ${PHASE16_CALENDAR_STAGE == 'drag-forward-10' || PHASE16_CALENDAR_STAGE == 'drag-forward-24_9' || PHASE16_CALENDAR_STAGE == 'drag-forward-25' || PHASE16_CALENDAR_STAGE == 'drag-forward-25_1' || PHASE16_CALENDAR_STAGE == 'drag-forward-release-below' || PHASE16_CALENDAR_STAGE == 'drag-forward-release-exact' || PHASE16_CALENDAR_STAGE == 'drag-forward-release-above' || PHASE16_CALENDAR_STAGE == 'drag-backward-10' || PHASE16_CALENDAR_STAGE == 'drag-backward-24_9' || PHASE16_CALENDAR_STAGE == 'drag-backward-25' || PHASE16_CALENDAR_STAGE == 'drag-backward-25_1' || PHASE16_CALENDAR_STAGE == 'drag-backward-release-below' || PHASE16_CALENDAR_STAGE == 'drag-backward-release-exact' || PHASE16_CALENDAR_STAGE == 'drag-backward-release-above' || PHASE16_CALENDAR_STAGE == 'drag-fast-subthreshold' || PHASE16_CALENDAR_STAGE == 'drag-retreat' || PHASE16_CALENDAR_STAGE == 'drag-cancel' || PHASE16_CALENDAR_STAGE == 'drag-vertical' || PHASE16_CALENDAR_STAGE == 'drag-diagonal' || PHASE16_CALENDAR_STAGE == 'week-expand-first-row' || PHASE16_CALENDAR_STAGE == 'week-expand-middle-row' || PHASE16_CALENDAR_STAGE == 'week-expand-last-row' || PHASE16_CALENDAR_STAGE == 'adjacent-week' || PHASE16_CALENDAR_STAGE == 'rapid-reverse-input' || PHASE16_CALENDAR_STAGE == 'second-input-interrupt' || PHASE16_CALENDAR_STAGE == 'rotation-during-transition' || PHASE16_CALENDAR_STAGE == 'background-during-transition' || PHASE16_CALENDAR_STAGE == 'reduced-motion' || PHASE16_CALENDAR_STAGE == 'accessibility-keyboard'}
- launchApp: { clearState: false, stopApp: true }
- openLink: "gymtracker-devtest://calendar?phase16CalendarStage=${PHASE16_CALENDAR_STAGE}"
- extendedWaitUntil: { visible: "Calendar", timeout: 30000 }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-10' || PHASE16_CALENDAR_STAGE == 'drag-forward-24_9' || PHASE16_CALENDAR_STAGE == 'drag-forward-25' || PHASE16_CALENDAR_STAGE == 'drag-forward-25_1' || PHASE16_CALENDAR_STAGE == 'drag-forward-release-below' || PHASE16_CALENDAR_STAGE == 'drag-forward-release-exact' || PHASE16_CALENDAR_STAGE == 'drag-forward-release-above' || PHASE16_CALENDAR_STAGE == 'drag-fast-subthreshold' || PHASE16_CALENDAR_STAGE == 'drag-retreat' || PHASE16_CALENDAR_STAGE == 'rapid-reverse-input' || PHASE16_CALENDAR_STAGE == 'second-input-interrupt' || PHASE16_CALENDAR_STAGE == 'rotation-during-transition' || PHASE16_CALENDAR_STAGE == 'background-during-transition'} }
    commands:
      - swipe: { start: 50%, 45%, end: 25%, 45%, duration: 400 }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-10' || PHASE16_CALENDAR_STAGE == 'drag-backward-24_9' || PHASE16_CALENDAR_STAGE == 'drag-backward-25' || PHASE16_CALENDAR_STAGE == 'drag-backward-25_1' || PHASE16_CALENDAR_STAGE == 'drag-backward-release-below' || PHASE16_CALENDAR_STAGE == 'drag-backward-release-exact' || PHASE16_CALENDAR_STAGE == 'drag-backward-release-above'} }
    commands:
      - swipe: { start: 50%, 45%, end: 75%, 45%, duration: 400 }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-cancel'} }
    commands:
      - swipe: { start: 50%, 45%, end: 58%, 45%, duration: 80 }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-vertical' || PHASE16_CALENDAR_STAGE == 'drag-diagonal'} }
    commands:
      - swipe: { start: 50%, 70%, end: 50%, 30%, duration: 300 }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'week-expand-first-row' || PHASE16_CALENDAR_STAGE == 'week-expand-middle-row' || PHASE16_CALENDAR_STAGE == 'week-expand-last-row' || PHASE16_CALENDAR_STAGE == 'adjacent-week' || PHASE16_CALENDAR_STAGE == 'reduced-motion'} }
    commands:
      - tapOn: { id: "calendar-month-viewport", optional: true }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'accessibility-keyboard'} }
    commands:
      - pressKey: TAB
      - pressKey: ENTER
- takeScreenshot: "calendar-${PHASE16_CALENDAR_STAGE}"
