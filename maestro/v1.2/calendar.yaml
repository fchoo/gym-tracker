appId: com.fchoo.gymtracker.devtest
name: Phase 16 Calendar diagnostic trace contract retained for Phase 20 observation
tags: [calendar-tracer, native-only, development-test, phase-16, phase-20, observe-only]
---
- assertTrue: ${PHASE16_CALENDAR_STAGE != null}
- assertTrue: ${PHASE16_CALENDAR_FIXTURE_ID == 'synthetic-calendar-v1'}
- launchApp: { clearState: false, stopApp: true }
- openLink: "gymtracker-devtest://calendar?phase16CalendarStage=${PHASE16_CALENDAR_STAGE}"
- extendedWaitUntil: { visible: "Calendar", timeout: 30000 }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-10'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-24_9'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-25'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-25_1'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-release-below'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-release-exact'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-forward-release-above'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-10'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-24_9'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-25'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-25_1'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-release-below'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-release-exact'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-backward-release-above'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-fast-subthreshold'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-retreat'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-cancel'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-vertical'} }
    commands:
      - swipe: { start: "50%, 70%", end: "50%, 30%", duration: 300 }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'drag-diagonal'} }
    commands:
      - swipe: { start: "50%, 70%", end: "58%, 30%", duration: 300 }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'week-expand-first-row'} }
    commands:
      - tapOn: { point: "50%, 24%" }
      - assertVisible: "Collapse day and return to month"
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'week-expand-middle-row'} }
    commands:
      - tapOn: { point: "50%, 45%" }
      - assertVisible: "Collapse day and return to month"
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'week-expand-last-row'} }
    commands:
      - tapOn: { point: "50%, 72%" }
      - assertVisible: "Collapse day and return to month"
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'adjacent-week'} }
    commands:
      - tapOn: { point: "50%, 68%" }
      - tapOn: { point: "82%, 76%" }
      - assertVisible: "Collapse day and return to month"
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'rapid-reverse-input'} }
    commands:
      - swipe: { start: "70%, 45%", end: "44.9%, 45%", duration: 100 }
      - swipe: { start: "30%, 45%", end: "55.1%, 45%", duration: 100 }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'second-input-interrupt'} }
    commands:
      - swipe: { start: "70%, 45%", end: "44.9%, 45%", duration: 80 }
      - swipe: { start: "70%, 45%", end: "44.9%, 45%", duration: 80 }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'rotation-during-transition'} }
    commands:
      - swipe: { start: "70%, 45%", end: "44.9%, 45%", duration: 80 }
      - setOrientation: LANDSCAPE
      - assertVisible: "Calendar"
      - setOrientation: PORTRAIT
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'background-during-transition'} }
    commands:
      - swipe: { start: "70%, 45%", end: "44.9%, 45%", duration: 80 }
      - pressKey: HOME
      - openLink: "gymtracker-devtest://calendar?phase16CalendarStage=background-during-transition"
      - extendedWaitUntil: { visible: "Calendar", timeout: 30000 }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'reduced-motion'} }
    commands:
      - assertTrue: ${PHASE16_CALENDAR_REDUCED_MOTION == 'verified-device-setting'}
      - openLink: "gymtracker-devtest://calendar?phase16CalendarStage=reduced-motion"
      - tapOn: { point: "50%, 45%" }
      - assertVisible: "Collapse day and return to month"
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'accessibility-keyboard'} }
    commands:
      - pressKey: TAB
      - pressKey: DPAD_RIGHT
      - pressKey: ENTER
      - assertVisible: "Collapse day and return to month"
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'month-year-boundary'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'leap-february'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'four-row-month'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'five-row-month'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'six-row-month'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'dev-01-padding'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- runFlow:
    when: { true: ${PHASE16_CALENDAR_STAGE == 'dev-02-light-title'} }
    commands:
      - assertVisible: { id: "calendar-month-viewport" }
      - assertVisible: { id: "calendar-month-title" }
- takeScreenshot: "calendar-${PHASE16_CALENDAR_STAGE}"
# Phase 20's shard binds the emitted Phase 16 source trace to timestamps,
# geometry, semantic order, callback generation, focused-week and motion fields.
# This screenshot is supplemental only and can never close an NV-CAL case alone.
