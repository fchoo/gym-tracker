    commands: [{ tapOn: { id: "calendar-day-2026-10-15" } }, { tapOn: { id: "calendar-agenda-event-v12-cal-strength-complete" } }, { pressKey: BACK }, { assertVisible: "15 October 2026" }, { assertVisible: { id: "calendar-agenda-event-v12-cal-strength-complete" } }]
- runFlow:
    when: { true: "${V12_CALENDAR_REQUIREMENT == 'CAL-20' && V12_CALENDAR_PROBE == 'trigger-focus-restored'}" }
    commands: [{ tapOn: { id: "calendar-day-2026-10-15" } }, { tapOn: { id: "calendar-agenda-event-v12-cal-strength-complete" } }, { pressKey: BACK }, { pressKey: ENTER }, { assertVisible: "Complete · read only" }]
- runFlow:
    when: { true: "${V12_CALENDAR_REQUIREMENT == 'CAL-20' && V12_CALENDAR_PROBE == 'exercise-disclosure'}" }
    commands: [{ tapOn: { id: "calendar-day-2026-10-15" } }, { tapOn: { id: "calendar-agenda-event-v12-cal-strength-complete" } }, { assertVisible: { id: "calendar-exercise-disclosure-v12-exercise" } }, { assertVisible: { id: "calendar-read-only-set-v12-set-complete" } }, { tapOn: "Bench press. Completed. 1 of 2 working sets. Collapse exercise" }, { assertNotVisible: { id: "calendar-read-only-set-v12-set-complete" } }, { tapOn: "Bench press. Completed. 1 of 2 working sets. Expand exercise" }, { assertVisible: { id: "calendar-read-only-set-v12-set-complete" } }]

- runFlow:
    when: { true: "${V12_CALENDAR_REQUIREMENT == 'CAL-21' && V12_CALENDAR_PROBE == 'loading-empty-error'}" }
    commands: [{ assertVisible: "Loading Calendar" }, { extendedWaitUntil: { visible: { id: "calendar-day-2026-10-15" }, timeout: 30000 } }, { tapOn: { id: "calendar-day-2026-10-15" } }, { assertVisible: "No workout" }, { tapOn: "Collapse day and return to month" }, { tapOn: "Show November 2026" }, { extendedWaitUntil: { visible: "Calendar could not be loaded", timeout: 30000 } }, { tapOn: "Retry Calendar" }, { extendedWaitUntil: { notVisible: "Updating Calendar", timeout: 30000 } }]
- runFlow:
    when: { true: "${V12_CALENDAR_REQUIREMENT == 'CAL-21' && V12_CALENDAR_PROBE == 'retry-retains-date'}" }
    commands: [{ tapOn: { id: "calendar-day-2026-10-22" } }, { assertVisible: "22 October 2026" }, { tapOn: "Show November 2026" }, { extendedWaitUntil: { visible: "Calendar could not be loaded", timeout: 30000 } }, { assertVisible: "22 October 2026" }, { tapOn: "Retry Calendar" }, { assertVisible: "22 October 2026" }]
- runFlow:
    when: { true: "${V12_CALENDAR_REQUIREMENT == 'CAL-21' && V12_CALENDAR_PROBE == 'no-invented-session'}" }
