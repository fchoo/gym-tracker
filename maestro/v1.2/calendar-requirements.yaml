    when: { true: "${V12_CALENDAR_REQUIREMENT == 'CAL-22' && V12_CALENDAR_PROBE == 'management-correction-route'}" }
    commands: [{ openLink: "gymtracker-devtest://session/v12-strength-complete?phase20CalendarFixture=v12-calendar-isolated-facts-v1&phase20CalendarEvidenceNonce=${V12_CALENDAR_EVIDENCE_NONCE}&phase20CalendarRequirementsSha256=${V12_CALENDAR_REQUIREMENTS_SHA256}" }, { assertVisible: "Correct workout" }, { tapOn: "Correct workout" }, { assertVisible: "Correction draft" }, { tapOn: "Show correction history" }, { assertVisible: "Correction history" }]
- runFlow:
    when: { true: "${V12_CALENDAR_REQUIREMENT == 'CAL-22' && V12_CALENDAR_PROBE == 'revision-conflict-retry'}" }
    commands:
      - openLink: "gymtracker-devtest://session/v12-strength-complete?phase20CalendarFixture=v12-calendar-isolated-facts-v1&phase20CalendarEvidenceNonce=${V12_CALENDAR_EVIDENCE_NONCE}&phase20CalendarRequirementsSha256=${V12_CALENDAR_REQUIREMENTS_SHA256}"
      - tapOn: "Correct workout"
      - extendedWaitUntil: { visible: "Correction draft", timeout: 30000 }
      - tapOn: "Working set 1 reps"
      - eraseText
      - inputText: "0"
      - hideKeyboard
      - tapOn: "Save correction"
      - assertVisible: "Correction needs attention"
      - tapOn: "Working set 1 reps"
      - eraseText
      - inputText: "5"
      - hideKeyboard
      - tapOn: "Owner note"
      - inputText: "Isolated correction proof"
      - hideKeyboard
      - tapOn: "Save correction"
      - assertVisible: "Workout changed elsewhere"
      - tapOn: "Reload workout"
      - tapOn: "Owner note"
      - inputText: "Isolated retry proof"
      - hideKeyboard
      - tapOn: "Save correction"
      - assertVisible: "Save failed"
      - tapOn: "Save correction"
      - assertVisible: "Workout details"

