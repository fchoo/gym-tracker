name: Pull Request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Scope: .planning/verification/TEST-NECESSITY-REASSESSMENT-20261030.md.
# Historical native/Nyquist/coverage producers remain available for separately
# justified changes. They do not gate this accepted personal release.
env:
  NODE_VERSION: 24.19.0
  NPM_VERSION: 11.17.0
  JAVA_VERSION: 17.0.20+8
  ANDROID_API_LEVEL: 36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK: 27.1.12297006

jobs:
  bootstrap:
    name: Bootstrap and static prerequisite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Pin npm
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - name: Install locked dependencies
        run: npm ci

      - name: Enforce dependency advisory policy
        run: npm run audit:dependencies
      - name: Test dependency policy and configuration guards
        run: node --test scripts/evaluate-npm-audit.test.mjs scripts/google-oauth-config.test.mjs scripts/assert-generated-production-android.test.mjs
      - name: Verify Expo compatibility
        env:
          EXPO_OFFLINE: "1"
        run: |
          export EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="$(node --input-type=module -e 'import { GOOGLE_OAUTH_REGISTRATIONS } from "./scripts/google-oauth-config.mjs"; process.stdout.write(GOOGLE_OAUTH_REGISTRATIONS.webClientId)')"
          npx expo install --check
          npx expo-doctor
      - name: Verify source checks
        run: |
          npm run typecheck
          for script in scripts/*.sh; do sh -n "$script"; done
          for script in scripts/*.mjs; do node --check "$script"; done

  required-suite-contract:
    name: Required suite contract
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep registered verification commands available
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const requiredScripts = [
            'check:boundaries',
            'test:unit',
            'test:components',
            'test:sqlite:host',
            'test:integration',
            'test:coverage',
            'test:coverage:phase18',
            'test:sqlite:device',
            'test:maestro:phase1',
            'test:maestro:phase12',
            'benchmark:phase1',
            'benchmark:phase12:backup',
            'verify:artifact-roundtrip',
            'verify:phase12:evidence',
            'test:evidence:phase12',
            'test:evidence:v12',
            'test:evidence:v12:all',
            'validate:v12:prebuild',
            'test:all',
            'ci:pr',
          ];
          const missing = requiredScripts.filter((name) => !packageJson.scripts?.[name]);
          if (missing.length > 0) {
            console.error(`Required scripts are missing: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

  host-gates:
    name: Typecheck through host SQLite
    needs: required-suite-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Pin npm and install
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and boundaries
        run: |
          npm run lint
          npm run check:boundaries
      - name: Unit tests
        run: npm run test:unit -- --runInBand
      - name: Component tests
        run: npm run test:components -- --runInBand
      - name: Host SQLite tests
        run: npm run test:sqlite:host -- --runInBand
      - name: Integration tests
        run: npm run test:integration -- --runInBand
      - name: Native router transitions
        run: npx jest --config jest.config.js --selectProjects native-router --runInBand

  generated-native:
    name: Clean generated Android contract
    needs: host-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install pinned Android SDK components
        run: sh scripts/install-pinned-android-sdk.sh
      - name: Install and verify clean generation
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci
          export EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="$(node --input-type=module -e 'import { GOOGLE_OAUTH_REGISTRATIONS } from "./scripts/google-oauth-config.mjs"; process.stdout.write(GOOGLE_OAUTH_REGISTRATIONS.webClientId)')"
          npm run verify:cng
          test -z "$(git ls-files android ios)"
      - name: Bundle production Android JavaScript
        run: |
          export GYM_TRACKER_BUILD_PROFILE=production
          export EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="$(node --input-type=module -e 'import { GOOGLE_OAUTH_REGISTRATIONS } from "./scripts/google-oauth-config.mjs"; process.stdout.write(GOOGLE_OAUTH_REGISTRATIONS.webClientId)')"
          npx expo export --platform android --output-dir artifacts/ci/android-bundle
