name: Protected attended release evidence

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful private release-candidate workflow run ID
        required: true
        type: string
      candidate_id:
        description: Immutable candidate identifier
        required: true
        type: string
      candidate_commit:
        description: Exact candidate source commit
        required: true
        type: string
      manifest_sha256:
        description: Canonical candidate manifest SHA-256
        required: true
        type: string
      observations_run_id:
        description: Successful run containing human-authored observations and attachments
        required: true
        type: string
      observations_artifact_name:
        description: Immutable supplied observation/evidence artifact name
        required: true
        type: string
      observations_sha256:
        description: Canonical observations.json SHA-256
        required: true
        type: string
      owner_token:
        description: Owner must personally enter exact lowercase approved after every row passes
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  id-token: none

concurrency:
  group: release-attended-${{ github.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ID: ${{ inputs.candidate_id }}
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  OBSERVATIONS_RUN_ID: ${{ inputs.observations_run_id }}
  OBSERVATIONS_ARTIFACT_NAME: ${{ inputs.observations_artifact_name }}
  OBSERVATIONS_SHA256: ${{ inputs.observations_sha256 }}
  OWNER_TOKEN: ${{ inputs.owner_token }}
  ATTENDED_ARTIFACT_NAME: attended-release-evidence-${{ inputs.candidate_id }}

jobs:
  record-attended-evidence:
    name: Validate supplied observations and record immutable evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: private-release-attended
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validate dispatch inputs and selected runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${CANDIDATE_RUN_ID}:${OBSERVATIONS_RUN_ID}" in *[!0-9:]*|:*|*:) exit 1 ;; esac
          case "${CANDIDATE_ID}" in ''|*[!a-z0-9-]*|-*|*-) exit 1 ;; esac
          case "${OBSERVATIONS_ARTIFACT_NAME}" in ''|*[!A-Za-z0-9._-]*|.*|*.) exit 1 ;; esac
          test "${#CANDIDATE_ID}" -ge 3
          test "${#CANDIDATE_ID}" -le 80
          test "${#OBSERVATIONS_ARTIFACT_NAME}" -le 128
          case "${CANDIDATE_COMMIT}:${MANIFEST_SHA256}:${OBSERVATIONS_SHA256}" in *[!a-f0-9:]*) exit 1 ;; esac
          test "${#CANDIDATE_COMMIT}" -eq 40
          test "${#MANIFEST_SHA256}" -eq 64
          test "${#OBSERVATIONS_SHA256}" -eq 64
          test "${OWNER_TOKEN}" = "approved"
          verify_deployment_provenance() {
            local run_id="$1"
            local run_attempt="$2"
            local commit="$3"
            local ref="$4"
            local environment="$5"
            local run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            local run_job_prefix="${run_url}/job/"
            local deployments
            local deployment_ids
            local deployment_id
            local expected_deployment_url
            local statuses
            local latest_status
            local log_url
            local job_id
            local job
            local matched=0
            deployments=$(gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              -f sha="${commit}" -f ref="${ref}" -f environment="${environment}" \
              -F per_page=100)
            deployment_ids=$(jq -er \
              --arg api_url "${GITHUB_API_URL}" --arg repo "${GITHUB_REPOSITORY}" \
              --arg commit "${commit}" --arg ref "${ref}" --arg environment "${environment}" '
              if all(.[]; type == "array") then
                [.[][] | select(
                  .sha == $commit
                  and .ref == $ref
                  and .environment == $environment
                  and .original_environment == $environment
                  and .performed_via_github_app.slug == "github-actions"
                  and (.id | type == "number")
                  and .statuses_url == ($api_url + "/repos/" + $repo + "/deployments/" + (.id | tostring) + "/statuses")
                ) | .id]
                | if length > 0 then .[] else error("no matching deployment") end
              else error("malformed deployment pages") end
            ' <<<"${deployments}")
            while IFS= read -r deployment_id; do
              case "${deployment_id}" in ''|*[!0-9]*) return 1 ;; esac
              expected_deployment_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
              statuses=$(gh api --method GET --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                -F per_page=100)
              jq -e '
                if all(.[]; type == "array") then
                  [.[][]] as $statuses
                  | if ($statuses | length) > 0
                      and all($statuses[]; (.created_at | type == "string") and (.id | type == "number"))
                    then true
                    else error("missing or malformed deployment statuses")
                    end
                else error("malformed deployment status pages") end
              ' <<<"${statuses}" >/dev/null
              latest_status=$(jq -cer '[.[][]] | sort_by([.created_at, .id]) | last' <<<"${statuses}")
              if ! log_url=$(jq -er \
                --arg environment "${environment}" --arg run_url "${run_url}" \
                --arg run_job_prefix "${run_job_prefix}" \
                --arg deployment_url "${expected_deployment_url}" '
                select(
                  .state == "success"
                  and .environment == $environment
                  and .environment_url == $run_url
                  and .deployment_url == $deployment_url
                  and (.log_url | type == "string" and startswith($run_job_prefix))
                ) | .log_url
              ' <<<"${latest_status}"); then
                continue
              fi
              job_id="${log_url#"${run_job_prefix}"}"
              case "${job_id}" in ''|*[!0-9]*) continue ;; esac
              job=$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}")
              if jq -e --argjson job_id "${job_id}" --argjson run_id "${run_id}" \
                --argjson run_attempt "${run_attempt}" --arg commit "${commit}" \
                --arg html_url "${log_url}" '
                .id == $job_id
                  and .run_id == $run_id
                  and .run_attempt == $run_attempt
                  and .head_sha == $commit
                  and .status == "completed"
                  and .conclusion == "success"
                  and .html_url == $html_url
              ' <<<"${job}" >/dev/null; then
                matched=$((matched + 1))
              fi
            done <<<"${deployment_ids}"
            test "${matched}" -eq 1
          }
          candidate_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")
          observations_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}")
          candidate_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}"
          observations_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}"
          jq -e --argjson run_id "${CANDIDATE_RUN_ID}" --arg run_url "${candidate_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-candidate.yml"
            ' \
            <<<"${candidate_run}" >/dev/null
          jq -e --argjson run_id "${OBSERVATIONS_RUN_ID}" --arg run_url "${observations_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-human-evidence-upload.yml"
            ' \
            <<<"${observations_run}" >/dev/null
          candidate_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${candidate_run}")
          candidate_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${candidate_run}")
          observations_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${observations_run}")
          observations_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${observations_run}")
          verify_deployment_provenance "${CANDIDATE_RUN_ID}" "${candidate_run_attempt}" "${CANDIDATE_COMMIT}" "${candidate_ref}" "private-release-candidate"
          verify_deployment_provenance "${OBSERVATIONS_RUN_ID}" "${observations_run_attempt}" "${CANDIDATE_COMMIT}" "${observations_ref}" "private-release-observation-upload"
          candidate_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" -F per_page=100)
          observations_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}/artifacts" -F per_page=100)
          jq -e --argjson run_id "${CANDIDATE_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "private-release-candidate-${CANDIDATE_ID}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)] | length == 1
            else error("malformed artifact pages") end
            ' <<<"${candidate_artifacts}" >/dev/null
          jq -e --argjson run_id "${OBSERVATIONS_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "${OBSERVATIONS_ARTIFACT_NAME}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)] | length == 1
            else error("malformed artifact pages") end
            ' <<<"${observations_artifacts}" >/dev/null

      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts

      - name: Download exact candidate and supplied observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "private-release-candidate-${CANDIDATE_ID}" --dir retained-candidate
          gh run download "${OBSERVATIONS_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${OBSERVATIONS_ARTIFACT_NAME}" --dir supplied-evidence
          printf '%s  %s\n' "${OBSERVATIONS_SHA256}" supplied-evidence/observations.json | sha256sum --check

      - name: Generate only the canonical pending checklist
        run: |
          mkdir -p attended-evidence
          npm run prepare:attended:phase5 -- \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --output attended-evidence/checklist.pending.json

      - name: Record supplied observations under protected approval
        run: |
          cp supplied-evidence/observations.json attended-evidence/observations.json
          cp -R supplied-evidence/attachments attended-evidence/attachments
          npm run record:attended:phase5 -- \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --checklist attended-evidence/checklist.pending.json \
            --observations attended-evidence/observations.json \
            --evidence-dir attended-evidence \
            --owner-token "${OWNER_TOKEN}" \
            --output attended-evidence/attended-record.json
          npm run verify:attended:phase5 -- \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --checklist attended-evidence/checklist.pending.json \
            --observations attended-evidence/observations.json \
            --evidence-dir attended-evidence \
            --record attended-evidence/attended-record.json

      - name: Upload immutable attended evidence bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ATTENDED_ARTIFACT_NAME }}
          path: attended-evidence
          if-no-files-found: error
          retention-days: 30
