name: Protected attended release evidence

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful private release-candidate workflow run ID
        required: true
        type: string
      candidate_id:
        description: Immutable candidate identifier
        required: true
        type: string
      candidate_commit:
        description: Exact candidate source commit
        required: true
        type: string
      manifest_sha256:
        description: Canonical candidate manifest SHA-256
        required: true
        type: string
      observations_run_id:
        description: Successful run containing human-authored observations and attachments
        required: true
        type: string
      observations_artifact_name:
        description: Immutable supplied observation/evidence artifact name
        required: true
        type: string
      observations_sha256:
        description: Canonical observations.json SHA-256
        required: true
        type: string
      owner_token:
        description: Owner must personally enter exact lowercase approved after every row passes
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: none

concurrency:
  group: release-attended-${{ github.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ID: ${{ inputs.candidate_id }}
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  OBSERVATIONS_RUN_ID: ${{ inputs.observations_run_id }}
  OBSERVATIONS_ARTIFACT_NAME: ${{ inputs.observations_artifact_name }}
  OBSERVATIONS_SHA256: ${{ inputs.observations_sha256 }}
  OWNER_TOKEN: ${{ inputs.owner_token }}
  ATTENDED_ARTIFACT_NAME: attended-release-evidence-${{ inputs.candidate_id }}

jobs:
  record-attended-evidence:
    name: Validate supplied observations and record immutable evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: private-release-attended
    steps:
      - name: Validate dispatch inputs and selected runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${CANDIDATE_RUN_ID}:${OBSERVATIONS_RUN_ID}" in *[!0-9:]*|:*|*:) exit 1 ;; esac
          case "${CANDIDATE_ID}" in ''|*[!a-z0-9-]*|-*|*-) exit 1 ;; esac
          case "${OBSERVATIONS_ARTIFACT_NAME}" in ''|*[!A-Za-z0-9._-]*|.*|*.) exit 1 ;; esac
          test "${#CANDIDATE_ID}" -ge 3
          test "${#CANDIDATE_ID}" -le 80
          test "${#OBSERVATIONS_ARTIFACT_NAME}" -le 128
          case "${CANDIDATE_COMMIT}:${MANIFEST_SHA256}:${OBSERVATIONS_SHA256}" in *[!a-f0-9:]*) exit 1 ;; esac
          test "${#CANDIDATE_COMMIT}" -eq 40
          test "${#MANIFEST_SHA256}" -eq 64
          test "${#OBSERVATIONS_SHA256}" -eq 64
          test "${OWNER_TOKEN}" = "approved"
          candidate_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")
          observations_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}")
          jq -e --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" \
            '.conclusion == "success" and .head_sha == $commit and .repository.full_name == $repo and .event == "workflow_dispatch" and .path == ".github/workflows/release-candidate.yml"' \
            <<<"${candidate_run}" >/dev/null
          jq -e --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" \
            '.conclusion == "success" and .head_sha == $commit and .repository.full_name == $repo and .event == "workflow_dispatch" and .path == ".github/workflows/release-human-evidence-upload.yml"' \
            <<<"${observations_run}" >/dev/null
          candidate_jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs")
          observations_jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}/jobs")
          jq -e '.jobs | any(.environment.name == "private-release-candidate")' <<<"${candidate_jobs}" >/dev/null
          jq -e '.jobs | any(.environment.name == "private-release-observation-upload")' <<<"${observations_jobs}" >/dev/null

      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts

      - name: Download exact candidate and supplied observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "private-release-candidate-${CANDIDATE_ID}" --dir retained-candidate
          gh run download "${OBSERVATIONS_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${OBSERVATIONS_ARTIFACT_NAME}" --dir supplied-evidence
          printf '%s  %s\n' "${OBSERVATIONS_SHA256}" supplied-evidence/observations.json | sha256sum --check

      - name: Generate only the canonical pending checklist
        run: |
          mkdir -p attended-evidence
          npm run prepare:attended:phase5 -- \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --output attended-evidence/checklist.pending.json

      - name: Record supplied observations under protected approval
        run: |
          cp supplied-evidence/observations.json attended-evidence/observations.json
          cp -R supplied-evidence/attachments attended-evidence/attachments
          npm run record:attended:phase5 -- \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --checklist attended-evidence/checklist.pending.json \
            --observations attended-evidence/observations.json \
            --evidence-dir attended-evidence \
            --owner-token "${OWNER_TOKEN}" \
            --output attended-evidence/attended-record.json
          npm run verify:attended:phase5 -- \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --checklist attended-evidence/checklist.pending.json \
            --observations attended-evidence/observations.json \
            --evidence-dir attended-evidence \
            --record attended-evidence/attended-record.json

      - name: Upload immutable attended evidence bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ATTENDED_ARTIFACT_NAME }}
          path: attended-evidence
          if-no-files-found: error
          retention-days: 30
