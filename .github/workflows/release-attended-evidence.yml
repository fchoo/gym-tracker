name: Protected attended release evidence

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful private release-candidate workflow run ID
        required: true
        type: string
      candidate_id:
        description: Immutable candidate identifier
        required: true
        type: string
      candidate_commit:
        description: Exact candidate source commit
        required: true
        type: string
      manifest_sha256:
        description: Canonical candidate manifest SHA-256
        required: true
        type: string
      observations_run_id:
        description: Successful run containing human-authored observations and attachments
        required: true
        type: string
      observations_sha256:
        description: Canonical observations.json SHA-256
        required: true
        type: string
      phase6_evidence_run_id:
        description: Successful protected upload run containing canonical Phase 6 N4 evidence
        required: true
        type: string
      phase6_evidence_artifact_name:
        description: Immutable Phase 6 N4 evidence artifact name
        required: true
        type: string
      phase6_n4_record_sha256:
        description: Canonical Phase 6 N4 attended-record.json SHA-256
        required: true
        type: string
      owner_token:
        description: Owner must personally enter exact lowercase approved after every row passes
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  id-token: none

concurrency:
  group: release-attended-${{ github.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ID: ${{ inputs.candidate_id }}
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  OBSERVATIONS_RUN_ID: ${{ inputs.observations_run_id }}
  OBSERVATIONS_ARTIFACT_NAME: human-release-observations-${{ inputs.candidate_id }}-${{ inputs.observations_run_id }}
  OBSERVATIONS_SHA256: ${{ inputs.observations_sha256 }}
  PHASE6_EVIDENCE_RUN_ID: ${{ inputs.phase6_evidence_run_id }}
  PHASE6_EVIDENCE_ARTIFACT_NAME: ${{ inputs.phase6_evidence_artifact_name }}
  PHASE6_N4_RECORD_SHA256: ${{ inputs.phase6_n4_record_sha256 }}
  ATTENDED_ARTIFACT_NAME: attended-release-evidence-${{ inputs.candidate_id }}

jobs:
  record-attended-evidence:
    name: Validate supplied observations and record immutable evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: private-release-attended
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Require trusted main workflow source
        run: |
          test "${GITHUB_SHA}" = "${CANDIDATE_COMMIT}"
          test "${GITHUB_REF_NAME}" = "main"

      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-workflow-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Validate dispatch inputs and selected runs
        id: selected_artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in "${CANDIDATE_RUN_ID}" "${OBSERVATIONS_RUN_ID}" "${PHASE6_EVIDENCE_RUN_ID}"
          do
            case "${run_id}" in ''|0|0*|*[!0-9]*) exit 1 ;; esac
          done
          case "${CANDIDATE_ID}" in ''|*[!a-z0-9-]*|-*|*-) exit 1 ;; esac
          case "${OBSERVATIONS_ARTIFACT_NAME}" in ''|*[!A-Za-z0-9._-]*|.*|*.) exit 1 ;; esac
          case "${PHASE6_EVIDENCE_ARTIFACT_NAME}" in ''|*[!A-Za-z0-9._-]*|.*|*.) exit 1 ;; esac
          test "${#CANDIDATE_ID}" -ge 3
          test "${#CANDIDATE_ID}" -le 80
          test "${#OBSERVATIONS_ARTIFACT_NAME}" -le 128
          test "${#PHASE6_EVIDENCE_ARTIFACT_NAME}" -le 128
          test "${PHASE6_EVIDENCE_ARTIFACT_NAME}" = "phase6-n4-evidence-${CANDIDATE_ID}-${PHASE6_EVIDENCE_RUN_ID}"
          case "${CANDIDATE_COMMIT}:${MANIFEST_SHA256}:${OBSERVATIONS_SHA256}:${PHASE6_N4_RECORD_SHA256}" in *[!a-f0-9:]*) exit 1 ;; esac
          test "${#CANDIDATE_COMMIT}" -eq 40
          test "${#MANIFEST_SHA256}" -eq 64
          test "${#OBSERVATIONS_SHA256}" -eq 64
          test "${#PHASE6_N4_RECORD_SHA256}" -eq 64
          verify_deployment_provenance() {
            local run_id="$1"
            local run_attempt="$2"
            local commit="$3"
            local ref="$4"
            local environment="$5"
            local run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            local run_job_prefix="${run_url}/job/"
            local deployments
            local deployment_ids
            local deployment_id
            local expected_deployment_url
            local statuses
            local latest_status
            local log_url
            local job_id
            local job
            local matched=0
            deployments=$(gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              -f sha="${commit}" -f ref="${ref}" -f environment="${environment}" \
              -F per_page=100)
            deployment_ids=$(jq -er \
              --arg api_url "${GITHUB_API_URL}" --arg repo "${GITHUB_REPOSITORY}" \
              --arg commit "${commit}" --arg ref "${ref}" --arg environment "${environment}" '
              if all(.[]; type == "array") then
                [.[][] | select(
                  .sha == $commit
                  and .ref == $ref
                  and .environment == $environment
                  and .original_environment == $environment
                  and .performed_via_github_app.slug == "github-actions"
                  and (.id | type == "number")
                  and .statuses_url == ($api_url + "/repos/" + $repo + "/deployments/" + (.id | tostring) + "/statuses")
                ) | .id]
                | if length > 0 then .[] else error("no matching deployment") end
              else error("malformed deployment pages") end
            ' <<<"${deployments}")
            while IFS= read -r deployment_id; do
              case "${deployment_id}" in ''|*[!0-9]*) return 1 ;; esac
              expected_deployment_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
              statuses=$(gh api --method GET --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                -F per_page=100)
              jq -e '
                if all(.[]; type == "array") then
                  [.[][]] as $statuses
                  | if ($statuses | length) > 0
                      and all($statuses[]; (.created_at | type == "string") and (.id | type == "number"))
                    then true
                    else error("missing or malformed deployment statuses")
                    end
                else error("malformed deployment status pages") end
              ' <<<"${statuses}" >/dev/null
              latest_status=$(jq -cer '[.[][]] | sort_by([.created_at, .id]) | last' <<<"${statuses}")
              if ! log_url=$(jq -er \
                --arg environment "${environment}" --arg run_url "${run_url}" \
                --arg run_job_prefix "${run_job_prefix}" \
                --arg deployment_url "${expected_deployment_url}" '
                select(
                  .state == "success"
                  and .environment == $environment
                  and .environment_url == $run_url
                  and .deployment_url == $deployment_url
                  and (.log_url | type == "string" and startswith($run_job_prefix))
                ) | .log_url
              ' <<<"${latest_status}"); then
                continue
              fi
              job_id="${log_url#"${run_job_prefix}"}"
              case "${job_id}" in ''|*[!0-9]*) continue ;; esac
              job=$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}")
              if jq -e --argjson job_id "${job_id}" --argjson run_id "${run_id}" \
                --argjson run_attempt "${run_attempt}" --arg commit "${commit}" \
                --arg html_url "${log_url}" '
                .id == $job_id
                  and .run_id == $run_id
                  and .run_attempt == $run_attempt
                  and .head_sha == $commit
                  and .status == "completed"
                  and .conclusion == "success"
                  and .html_url == $html_url
              ' <<<"${job}" >/dev/null; then
                matched=$((matched + 1))
              fi
            done <<<"${deployment_ids}"
            test "${matched}" -eq 1
          }
          candidate_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")
          observations_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}")
          phase6_evidence_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE6_EVIDENCE_RUN_ID}")
          candidate_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}"
          observations_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}"
          phase6_evidence_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${PHASE6_EVIDENCE_RUN_ID}"
          jq -e --argjson run_id "${CANDIDATE_RUN_ID}" --arg run_url "${candidate_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-candidate.yml"
            ' \
            <<<"${candidate_run}" >/dev/null
          jq -e --argjson run_id "${OBSERVATIONS_RUN_ID}" --arg run_url "${observations_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-human-evidence-upload.yml"
            ' \
            <<<"${observations_run}" >/dev/null
          jq -e --argjson run_id "${PHASE6_EVIDENCE_RUN_ID}" --arg run_url "${phase6_evidence_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-human-evidence-upload.yml"
            ' \
            <<<"${phase6_evidence_run}" >/dev/null
          candidate_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${candidate_run}")
          candidate_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${candidate_run}")
          observations_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${observations_run}")
          observations_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${observations_run}")
          phase6_evidence_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${phase6_evidence_run}")
          phase6_evidence_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${phase6_evidence_run}")
          verify_deployment_provenance "${CANDIDATE_RUN_ID}" "${candidate_run_attempt}" "${CANDIDATE_COMMIT}" "${candidate_ref}" "private-release-candidate"
          verify_deployment_provenance "${OBSERVATIONS_RUN_ID}" "${observations_run_attempt}" "${CANDIDATE_COMMIT}" "${observations_ref}" "private-release-observation-upload"
          verify_deployment_provenance "${PHASE6_EVIDENCE_RUN_ID}" "${phase6_evidence_run_attempt}" "${CANDIDATE_COMMIT}" "${phase6_evidence_ref}" "private-release-observation-upload"
          candidate_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" -F per_page=100)
          observations_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATIONS_RUN_ID}/artifacts" -F per_page=100)
          phase6_evidence_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE6_EVIDENCE_RUN_ID}/artifacts" -F per_page=100)
          selected_candidate_artifact=$(jq -cer --argjson run_id "${CANDIDATE_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "private-release-candidate-${CANDIDATE_ID}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)]
              | if length == 1 then .[0] else error("candidate artifact is not unique") end
            else error("malformed artifact pages") end
            ' <<<"${candidate_artifacts}")
          selected_observations_artifact=$(jq -cer --argjson run_id "${OBSERVATIONS_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "${OBSERVATIONS_ARTIFACT_NAME}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)]
              | if length == 1 then .[0] else error("observations artifact is not unique") end
            else error("malformed artifact pages") end
            ' <<<"${observations_artifacts}")
          selected_phase6_n4_artifact=$(jq -cer --argjson run_id "${PHASE6_EVIDENCE_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "${PHASE6_EVIDENCE_ARTIFACT_NAME}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)]
              | if length == 1 then .[0] else error("Phase 6 artifact is not unique") end
            else error("malformed artifact pages") end
            ' <<<"${phase6_evidence_artifacts}")
          candidate_artifact_id=$(jq -er '.id | select(type == "number" and . >= 1)' <<<"${selected_candidate_artifact}")
          observations_artifact_id=$(jq -er '.id | select(type == "number" and . >= 1)' <<<"${selected_observations_artifact}")
          phase6_n4_artifact_id=$(jq -er '.id | select(type == "number" and . >= 1)' <<<"${selected_phase6_n4_artifact}")
          printf 'candidate_artifact_id=%s\n' "${candidate_artifact_id}" >> "${GITHUB_OUTPUT}"
          printf 'observations_artifact_id=%s\n' "${observations_artifact_id}" >> "${GITHUB_OUTPUT}"
          printf 'phase6_n4_artifact_id=%s\n' "${phase6_n4_artifact_id}" >> "${GITHUB_OUTPUT}"

      - name: Download exact candidate by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.selected_artifacts.outputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          path: retained-candidate

      - name: Download observations by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.selected_artifacts.outputs.observations_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.OBSERVATIONS_RUN_ID }}
          path: supplied-evidence

      - name: Download Phase 6 N4 evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.selected_artifacts.outputs.phase6_n4_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PHASE6_EVIDENCE_RUN_ID }}
          path: retained-candidate/evidence/phase6-n4-upload

      - name: Verify supplied observations digest
        run: |
          printf '%s  %s\n' "${OBSERVATIONS_SHA256}" supplied-evidence/observations.json | sha256sum --check

      - name: Verify exact Phase 6 N4 observation-only evidence
        run: |
          test "$(find retained-candidate/evidence/phase6-n4-upload/phase6 -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = "7"
          test "$(find retained-candidate/evidence/phase6-n4-upload/phase6 -mindepth 1 -maxdepth 1 ! -type f | wc -l | tr -d '[:space:]')" = "0"
          for evidence_file in checklist.json observations.json N4-01.png N4-02.png N4-03.png N4-04.png attended-record.json
          do
            test -f "retained-candidate/evidence/phase6-n4-upload/phase6/${evidence_file}"
            test ! -L "retained-candidate/evidence/phase6-n4-upload/phase6/${evidence_file}"
          done
          printf '%s  %s\n' "${PHASE6_N4_RECORD_SHA256}" retained-candidate/evidence/phase6-n4-upload/phase6/attended-record.json | sha256sum --check
          node trusted-workflow-source/scripts/generate-phase6-attended-checklist.mjs verify \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --checklist retained-candidate/evidence/phase6-n4-upload/phase6/checklist.json \
            --observations retained-candidate/evidence/phase6-n4-upload/phase6/observations.json \
            --evidence-dir retained-candidate/evidence/phase6-n4-upload/phase6 \
            --record retained-candidate/evidence/phase6-n4-upload/phase6/attended-record.json

      - name: Generate only the canonical pending checklist
        run: |
          mkdir -p attended-evidence
          node trusted-workflow-source/scripts/generate-phase5-attended-checklist.mjs prepare \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --phase6-n4-record retained-candidate/evidence/phase6-n4-upload/phase6/attended-record.json \
            --phase6-n4-checklist retained-candidate/evidence/phase6-n4-upload/phase6/checklist.json \
            --phase6-n4-observations retained-candidate/evidence/phase6-n4-upload/phase6/observations.json \
            --phase6-n4-evidence-dir retained-candidate/evidence/phase6-n4-upload/phase6 \
            --phase6-n4-run-id "${PHASE6_EVIDENCE_RUN_ID}" \
            --phase6-n4-artifact-name "${PHASE6_EVIDENCE_ARTIFACT_NAME}" \
            --output attended-evidence/checklist.pending.json

      - name: Record supplied observations under protected approval
        env:
          OWNER_TOKEN: ${{ inputs.owner_token }}
        run: |
          test "${OWNER_TOKEN}" = "approved"
          cp supplied-evidence/observations.json attended-evidence/observations.json
          cp -R supplied-evidence/attachments attended-evidence/attachments
          node trusted-workflow-source/scripts/generate-phase5-attended-checklist.mjs record \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --checklist attended-evidence/checklist.pending.json \
            --observations attended-evidence/observations.json \
            --evidence-dir attended-evidence \
            --phase6-n4-record retained-candidate/evidence/phase6-n4-upload/phase6/attended-record.json \
            --phase6-n4-checklist retained-candidate/evidence/phase6-n4-upload/phase6/checklist.json \
            --phase6-n4-observations retained-candidate/evidence/phase6-n4-upload/phase6/observations.json \
            --phase6-n4-evidence-dir retained-candidate/evidence/phase6-n4-upload/phase6 \
            --phase6-n4-run-id "${PHASE6_EVIDENCE_RUN_ID}" \
            --phase6-n4-artifact-name "${PHASE6_EVIDENCE_ARTIFACT_NAME}" \
            --owner-token "${OWNER_TOKEN}" \
            --output attended-evidence/attended-record.json
          node trusted-workflow-source/scripts/generate-phase5-attended-checklist.mjs verify \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --checklist attended-evidence/checklist.pending.json \
            --observations attended-evidence/observations.json \
            --evidence-dir attended-evidence \
            --phase6-n4-record retained-candidate/evidence/phase6-n4-upload/phase6/attended-record.json \
            --phase6-n4-checklist retained-candidate/evidence/phase6-n4-upload/phase6/checklist.json \
            --phase6-n4-observations retained-candidate/evidence/phase6-n4-upload/phase6/observations.json \
            --phase6-n4-evidence-dir retained-candidate/evidence/phase6-n4-upload/phase6 \
            --phase6-n4-run-id "${PHASE6_EVIDENCE_RUN_ID}" \
            --phase6-n4-artifact-name "${PHASE6_EVIDENCE_ARTIFACT_NAME}" \
            --record attended-evidence/attended-record.json

      - name: Upload immutable attended evidence bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ATTENDED_ARTIFACT_NAME }}
          path: attended-evidence
          if-no-files-found: error
          retention-days: 30
