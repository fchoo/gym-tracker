name: Personal APK

# Device-less, KVM-free build of a signed personal-use APK + AAB.
# No emulator, no Maestro, no evidence ceremony — just source gates that run
# on any hosted runner, then a signed Gradle release build uploaded as an
# artifact you can download and sideload.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'personal-*'

permissions:
  contents: read
  id-token: none

concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  NPM_VERSION: 11.17.0
  JAVA_VERSION: 17.0.20+8
  ANDROID_API_LEVEL: 36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK: 27.1.12297006

jobs:
  build:
    name: Build signed personal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install pinned Android SDK components
        run: sh scripts/install-pinned-android-sdk.sh

      - name: Install locked dependencies
        run: |
          npm install --global "npm@${NPM_VERSION}"
          npm ci

      - name: Run device-free source gates
        run: |
          npm run typecheck
          npm run lint
          npm run check:boundaries
          npm run test:all

      - name: Materialize signing inputs without logging their values
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "${RELEASE_KEYSTORE_BASE64}"
          test -n "${RELEASE_KEYSTORE_PASSWORD}"
          test -n "${RELEASE_KEY_ALIAS}"
          test -n "${RELEASE_KEY_PASSWORD}"
          umask 077
          mkdir -p "${RUNNER_TEMP}/gym-tracker-release-signing"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/gym-tracker-release-signing/release.keystore"
          test -s "${RUNNER_TEMP}/gym-tracker-release-signing/release.keystore"

      - name: Build signed APK and AAB
        env:
          GYM_TRACKER_BUILD_PROFILE: production
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/gym-tracker-release-signing/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./scripts/build-release-candidate-once.sh --output-dir artifacts/release-candidate

      - name: Verify the APK is signed
        run: |
          apksigner="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$apksigner" verify --verbose artifacts/release-candidate/gym-tracker-release.apk

      - name: Remove signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/gym-tracker-release-signing"

      - name: Upload signed personal APK and AAB
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gym-tracker-personal-apk
          path: |
            artifacts/release-candidate/gym-tracker-release.apk
            artifacts/release-candidate/gym-tracker-release.aab
            artifacts/release-candidate/release-config.json
            artifacts/release-candidate/release-toolchain.json
          if-no-files-found: error
          retention-days: 90
