name: Release promotion (no rebuild)

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful private candidate workflow run ID
        required: true
        type: string
      candidate_id:
        description: Immutable private candidate identifier
        required: true
        type: string
      candidate_commit:
        description: Exact 40-character source commit built by the candidate run
        required: true
        type: string
      attended_run_id:
        description: Successful immutable attended-evidence workflow run ID
        required: true
        type: string
      attended_artifact_name:
        description: Immutable attended evidence artifact name
        required: true
        type: string
      attended_record_sha256:
        description: SHA-256 of canonical attended-record.json
        required: true
        type: string
      release_tag:
        description: New immutable release tag, for example v1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: write
  deployments: read
  id-token: none

concurrency:
  group: release-promotion
  cancel-in-progress: false

env:
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ID: ${{ inputs.candidate_id }}
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  ATTENDED_RUN_ID: ${{ inputs.attended_run_id }}
  ATTENDED_ARTIFACT_NAME: ${{ inputs.attended_artifact_name }}
  ATTENDED_RECORD_SHA256: ${{ inputs.attended_record_sha256 }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  promote:
    name: Verify selected successful runs and publish unchanged bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: public-release-promotion
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out workflow source for input validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow-source

      - name: Validate selected immutable workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${CANDIDATE_RUN_ID}:${ATTENDED_RUN_ID}" in *[!0-9:]*|:*|*:) exit 1 ;; esac
          case "${CANDIDATE_ID}" in ''|*[!a-z0-9-]*|-*|*-) exit 1 ;; esac
          case "${ATTENDED_ARTIFACT_NAME}" in ''|*[!A-Za-z0-9._-]*|.*|*.) exit 1 ;; esac
          test "${CANDIDATE_RUN_ID}" != "${ATTENDED_RUN_ID}"
          test "${#CANDIDATE_COMMIT}" -eq 40
          test "${#CANDIDATE_ID}" -ge 3
          test "${#CANDIDATE_ID}" -le 80
          test "${#ATTENDED_ARTIFACT_NAME}" -le 128
          test "${#ATTENDED_RECORD_SHA256}" -eq 64
          node workflow-source/scripts/validate-phase5-promotion-inputs.mjs \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --attended-run-id "${ATTENDED_RUN_ID}" \
            --candidate-id "${CANDIDATE_ID}" \
            --candidate-commit "${CANDIDATE_COMMIT}" \
            --attended-artifact-name "${ATTENDED_ARTIFACT_NAME}" \
            --attended-record-sha256 "${ATTENDED_RECORD_SHA256}" \
            --release-tag "${RELEASE_TAG}"
          verify_deployment_provenance() {
            local run_id="$1"
            local run_attempt="$2"
            local commit="$3"
            local ref="$4"
            local environment="$5"
            local run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            local run_job_prefix="${run_url}/job/"
            local deployments
            local deployment_ids
            local deployment_id
            local expected_deployment_url
            local statuses
            local latest_status
            local log_url
            local job_id
            local job
            local matched=0
            deployments=$(gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              -f sha="${commit}" -f ref="${ref}" -f environment="${environment}" \
              -F per_page=100)
            deployment_ids=$(jq -er \
              --arg api_url "${GITHUB_API_URL}" --arg repo "${GITHUB_REPOSITORY}" \
              --arg commit "${commit}" --arg ref "${ref}" --arg environment "${environment}" '
              if all(.[]; type == "array") then
                [.[][] | select(
                  .sha == $commit
                  and .ref == $ref
                  and .environment == $environment
                  and .original_environment == $environment
                  and .performed_via_github_app.slug == "github-actions"
                  and (.id | type == "number")
                  and .statuses_url == ($api_url + "/repos/" + $repo + "/deployments/" + (.id | tostring) + "/statuses")
                ) | .id]
                | if length > 0 then .[] else error("no matching deployment") end
              else error("malformed deployment pages") end
            ' <<<"${deployments}")
            while IFS= read -r deployment_id; do
              case "${deployment_id}" in ''|*[!0-9]*) return 1 ;; esac
              expected_deployment_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
              statuses=$(gh api --method GET --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                -F per_page=100)
              jq -e '
                if all(.[]; type == "array") then
                  [.[][]] as $statuses
                  | if ($statuses | length) > 0
                      and all($statuses[]; (.created_at | type == "string") and (.id | type == "number"))
                    then true
                    else error("missing or malformed deployment statuses")
                    end
                else error("malformed deployment status pages") end
              ' <<<"${statuses}" >/dev/null
              latest_status=$(jq -cer '[.[][]] | sort_by([.created_at, .id]) | last' <<<"${statuses}")
              if ! log_url=$(jq -er \
                --arg environment "${environment}" --arg run_url "${run_url}" \
                --arg run_job_prefix "${run_job_prefix}" \
                --arg deployment_url "${expected_deployment_url}" '
                select(
                  .state == "success"
                  and .environment == $environment
                  and .environment_url == $run_url
                  and .deployment_url == $deployment_url
                  and (.log_url | type == "string" and startswith($run_job_prefix))
                ) | .log_url
              ' <<<"${latest_status}"); then
                continue
              fi
              job_id="${log_url#"${run_job_prefix}"}"
              case "${job_id}" in ''|*[!0-9]*) continue ;; esac
              job=$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}")
              if jq -e --argjson job_id "${job_id}" --argjson run_id "${run_id}" \
                --argjson run_attempt "${run_attempt}" --arg commit "${commit}" \
                --arg html_url "${log_url}" '
                .id == $job_id
                  and .run_id == $run_id
                  and .run_attempt == $run_attempt
                  and .head_sha == $commit
                  and .status == "completed"
                  and .conclusion == "success"
                  and .html_url == $html_url
              ' <<<"${job}" >/dev/null; then
                matched=$((matched + 1))
              fi
            done <<<"${deployment_ids}"
            test "${matched}" -eq 1
          }
          candidate_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")
          attended_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ATTENDED_RUN_ID}")
          candidate_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}"
          attended_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${ATTENDED_RUN_ID}"
          jq -e --argjson run_id "${CANDIDATE_RUN_ID}" --arg run_url "${candidate_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-candidate.yml"
            ' \
            <<<"${candidate_run}" >/dev/null
          jq -e --argjson run_id "${ATTENDED_RUN_ID}" --arg run_url "${attended_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-attended-evidence.yml"
            ' \
            <<<"${attended_run}" >/dev/null
          candidate_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${candidate_run}")
          candidate_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${candidate_run}")
          attended_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${attended_run}")
          attended_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${attended_run}")
          verify_deployment_provenance "${CANDIDATE_RUN_ID}" "${candidate_run_attempt}" "${CANDIDATE_COMMIT}" "${candidate_ref}" "private-release-candidate"
          verify_deployment_provenance "${ATTENDED_RUN_ID}" "${attended_run_attempt}" "${CANDIDATE_COMMIT}" "${attended_ref}" "private-release-attended"
          candidate_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" -F per_page=100)
          attended_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ATTENDED_RUN_ID}/artifacts" -F per_page=100)
          jq -e --argjson run_id "${CANDIDATE_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "private-release-candidate-${CANDIDATE_ID}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)] | length == 1
            else error("malformed artifact pages") end
            ' \
            <<<"${candidate_artifacts}" >/dev/null
          jq -e --argjson run_id "${ATTENDED_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "${ATTENDED_ARTIFACT_NAME}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)] | length == 1
            else error("malformed artifact pages") end
            ' \
            <<<"${attended_artifacts}" >/dev/null

      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts

      - name: Download selected successful candidate and attended artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "private-release-candidate-${CANDIDATE_ID}" \
            --dir retained-candidate
          gh run download "${ATTENDED_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ATTENDED_ARTIFACT_NAME}" \
            --dir attended-evidence
          printf '%s  %s\n' "${ATTENDED_RECORD_SHA256}" \
            attended-evidence/attended-record.json | sha256sum --check

      - name: Verify full release gate without rebuilding
        run: |
          manifest_sha256=$(sha256sum retained-candidate/release-candidate.json | cut -d' ' -f1)
          npm run verify:attended:phase5 -- \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${manifest_sha256}" \
            --automated-evidence retained-candidate/evidence/automated.json \
            --checklist attended-evidence/checklist.pending.json \
            --observations attended-evidence/observations.json \
            --evidence-dir attended-evidence \
            --record attended-evidence/attended-record.json

      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}"; then exit 1; fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then exit 1; fi
          candidate_run_id="${CANDIDATE_RUN_ID}"
          release_bodies=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[].body // ""')
          if grep -F "Candidate run: ${candidate_run_id}" <<<"${release_bodies}"; then
            echo "candidate run was already reused by a public release" >&2
            exit 1
          fi

      - name: Create draft with verified retained bytes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            retained-candidate/gym-tracker-release.apk \
            retained-candidate/gym-tracker-release.aab \
            --title "Gym Tracker ${RELEASE_TAG}" \
            --target "${CANDIDATE_COMMIT}" \
            --notes "Candidate run: ${CANDIDATE_RUN_ID}" \
            --draft

      - name: Verify public release asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/public-assets"
          gh release download "${RELEASE_TAG}" \
            --dir "${RUNNER_TEMP}/public-assets" \
            --pattern 'gym-tracker-release.*'
          (cd retained-candidate && sha256sum gym-tracker-release.apk gym-tracker-release.aab) \
            > "${RUNNER_TEMP}/public-assets.sha256"
          (cd "${RUNNER_TEMP}/public-assets" && sha256sum --check "${RUNNER_TEMP}/public-assets.sha256")

      - name: Publish hash-verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}" --draft=false

      - name: Record immutable post-promotion proof
        run: |
          manifest_sha256=$(sha256sum retained-candidate/release-candidate.json | cut -d' ' -f1)
          node scripts/record-phase5-promotion-proof.mjs \
            --bundle-dir retained-candidate \
            --manifest-sha256 "${manifest_sha256}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --attended-run-id "${ATTENDED_RUN_ID}" \
            --attended-artifact-name "${ATTENDED_ARTIFACT_NAME}" \
            --attended-record attended-evidence/attended-record.json \
            --attended-record-sha256 "${ATTENDED_RECORD_SHA256}" \
            --promotion-run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --release-tag "${RELEASE_TAG}" \
            --public-assets-dir "${RUNNER_TEMP}/public-assets" \
            --output promotion-proof.json

      - name: Upload immutable promotion proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-proof-${{ github.run_id }}
          path: promotion-proof.json
          if-no-files-found: error
          retention-days: 30
