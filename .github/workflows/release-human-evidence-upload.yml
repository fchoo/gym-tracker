name: Protected human release evidence upload

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful private release-candidate workflow run ID
        required: true
        type: string
      candidate_id:
        description: Immutable candidate identifier
        required: true
        type: string
      candidate_commit:
        description: Exact candidate source commit
        required: true
        type: string
      observations_path:
        description: Relative path beneath the protected EVIDENCE_ROOT to canonical observations.json
        required: true
        type: string
      attachments_path:
        description: Relative path beneath the protected EVIDENCE_ROOT to the attended attachments directory
        required: true
        type: string
      phase6_n4_evidence_path:
        description: Relative path beneath the protected EVIDENCE_ROOT to the canonical Phase 6 N4 evidence directory
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  id-token: none

concurrency:
  group: release-human-evidence-upload
  cancel-in-progress: false

env:
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ID: ${{ inputs.candidate_id }}
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  OBSERVATIONS_PATH: ${{ inputs.observations_path }}
  ATTACHMENTS_PATH: ${{ inputs.attachments_path }}
  PHASE6_N4_EVIDENCE_PATH: ${{ inputs.phase6_n4_evidence_path }}
  OBSERVATIONS_ARTIFACT_NAME: human-release-observations-${{ inputs.candidate_id }}-${{ github.run_id }}
  PHASE6_N4_ARTIFACT_NAME: phase6-n4-evidence-${{ inputs.candidate_id }}-${{ github.run_id }}

jobs:
  upload-human-evidence:
    name: Upload existing human-authored observations and attachments
    runs-on: [self-hosted, release-evidence]
    timeout-minutes: 10
    environment:
      name: private-release-observation-upload
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validate candidate provenance with trusted inline shell
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ROOT: ${{ vars.PHASE5_EVIDENCE_ROOT }}
        run: |
          set -euo pipefail
          case "${CANDIDATE_RUN_ID}" in ''|*[!0-9]*) exit 1 ;; esac
          case "${CANDIDATE_ID}" in ''|*[!a-z0-9-]*|-*|*-) exit 1 ;; esac
          case "${CANDIDATE_COMMIT}" in *[!a-f0-9]*) exit 1 ;; esac
          test "${#CANDIDATE_COMMIT}" -eq 40
          test -n "${EVIDENCE_ROOT}"
          verify_deployment_provenance() {
            local run_id="$1"
            local run_attempt="$2"
            local commit="$3"
            local ref="$4"
            local environment="$5"
            local run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            local run_job_prefix="${run_url}/job/"
            local deployments
            local deployment_ids
            local deployment_id
            local expected_deployment_url
            local statuses
            local latest_status
            local log_url
            local job_id
            local job
            local matched=0
            deployments=$(gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              -f sha="${commit}" -f ref="${ref}" -f environment="${environment}" \
              -F per_page=100)
            deployment_ids=$(jq -er \
              --arg api_url "${GITHUB_API_URL}" --arg repo "${GITHUB_REPOSITORY}" \
              --arg commit "${commit}" --arg ref "${ref}" --arg environment "${environment}" '
              if all(.[]; type == "array") then
                [.[][] | select(
                  .sha == $commit
                  and .ref == $ref
                  and .environment == $environment
                  and .original_environment == $environment
                  and .performed_via_github_app.slug == "github-actions"
                  and (.id | type == "number")
                  and .statuses_url == ($api_url + "/repos/" + $repo + "/deployments/" + (.id | tostring) + "/statuses")
                ) | .id]
                | if length > 0 then .[] else error("no matching deployment") end
              else error("malformed deployment pages") end
            ' <<<"${deployments}")
            while IFS= read -r deployment_id; do
              case "${deployment_id}" in ''|*[!0-9]*) return 1 ;; esac
              expected_deployment_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
              statuses=$(gh api --method GET --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                -F per_page=100)
              jq -e '
                if all(.[]; type == "array") then
                  [.[][]] as $statuses
                  | if ($statuses | length) > 0
                      and all($statuses[]; (.created_at | type == "string") and (.id | type == "number"))
                    then true
                    else error("missing or malformed deployment statuses")
                    end
                else error("malformed deployment status pages") end
              ' <<<"${statuses}" >/dev/null
              latest_status=$(jq -cer '[.[][]] | sort_by([.created_at, .id]) | last' <<<"${statuses}")
              if ! log_url=$(jq -er \
                --arg environment "${environment}" --arg run_url "${run_url}" \
                --arg run_job_prefix "${run_job_prefix}" \
                --arg deployment_url "${expected_deployment_url}" '
                select(
                  .state == "success"
                  and .environment == $environment
                  and .environment_url == $run_url
                  and .deployment_url == $deployment_url
                  and (.log_url | type == "string" and startswith($run_job_prefix))
                ) | .log_url
              ' <<<"${latest_status}"); then
                continue
              fi
              job_id="${log_url#"${run_job_prefix}"}"
              case "${job_id}" in ''|*[!0-9]*) continue ;; esac
              job=$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}")
              if jq -e --argjson job_id "${job_id}" --argjson run_id "${run_id}" \
                --argjson run_attempt "${run_attempt}" --arg commit "${commit}" \
                --arg html_url "${log_url}" '
                .id == $job_id
                  and .run_id == $run_id
                  and .run_attempt == $run_attempt
                  and .head_sha == $commit
                  and .status == "completed"
                  and .conclusion == "success"
                  and .html_url == $html_url
              ' <<<"${job}" >/dev/null; then
                matched=$((matched + 1))
              fi
            done <<<"${deployment_ids}"
            test "${matched}" -eq 1
          }
          candidate_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")
          candidate_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}"
          jq -e --argjson run_id "${CANDIDATE_RUN_ID}" --arg run_url "${candidate_run_url}" \
            --arg commit "${CANDIDATE_COMMIT}" --arg repo "${GITHUB_REPOSITORY}" '
            .id == $run_id and .status == "completed" and .conclusion == "success"
              and .html_url == $run_url and .head_sha == $commit and .head_branch == "main"
              and .repository.full_name == $repo and .event == "workflow_dispatch"
              and .path == ".github/workflows/release-candidate.yml"
            ' \
            <<<"${candidate_run}" >/dev/null
          candidate_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<<"${candidate_run}")
          candidate_ref=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<<"${candidate_run}")
          verify_deployment_provenance "${CANDIDATE_RUN_ID}" "${candidate_run_attempt}" "${CANDIDATE_COMMIT}" "${candidate_ref}" "private-release-candidate"
          candidate_artifacts=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" -F per_page=100)
          jq -e --argjson run_id "${CANDIDATE_RUN_ID}" --arg commit "${CANDIDATE_COMMIT}" \
            --arg name "private-release-candidate-${CANDIDATE_ID}" '
            if all(.[]; type == "object" and (.artifacts | type == "array")) then
              [.[] | .artifacts[] | select(.name == $name and .expired == false
                and .workflow_run.id == $run_id and .workflow_run.head_sha == $commit)] | length == 1
            else error("malformed artifact pages") end
            ' \
            <<<"${candidate_artifacts}" >/dev/null

      - name: Check out exact proven candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: workflow-source

      - name: Download exact candidate for Phase 6 N4 validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "private-release-candidate-${CANDIDATE_ID}" \
            --dir "${RUNNER_TEMP}/gym-tracker-phase6-candidate"

      - name: Stage bounded local evidence inputs
        env:
          EVIDENCE_ROOT: ${{ vars.PHASE5_EVIDENCE_ROOT }}
        run: |
          node workflow-source/scripts/stage-phase5-human-evidence.mjs \
            --evidence-root "${EVIDENCE_ROOT}" \
            --observations-relative "${OBSERVATIONS_PATH}" \
            --attachments-relative "${ATTACHMENTS_PATH}" \
            --staging-root "${RUNNER_TEMP}"

      - name: Stage exact canonical Phase 6 N4 evidence files
        env:
          EVIDENCE_ROOT: ${{ vars.PHASE5_EVIDENCE_ROOT }}
        run: |
          set -euo pipefail
          case "${PHASE6_N4_EVIDENCE_PATH}" in
            ''|/*|.|..|./*|../*|*/./*|*/../*|*/.|*/..) exit 1 ;;
          esac
          evidence_root=$(realpath "${EVIDENCE_ROOT}")
          test -d "${evidence_root}"
          test ! -L "${EVIDENCE_ROOT}"
          phase6_requested="${evidence_root}/${PHASE6_N4_EVIDENCE_PATH}"
          test ! -L "${phase6_requested}"
          phase6_source=$(realpath "${phase6_requested}")
          test "${phase6_source}" = "${phase6_requested}"
          case "${phase6_source}" in "${evidence_root}"/*) ;; *) exit 1 ;; esac
          test -d "${phase6_source}"
          phase6_candidate_root="${RUNNER_TEMP}/gym-tracker-phase6-candidate"
          phase6_staging_root="${phase6_candidate_root}/evidence/phase6-n4-upload"
          test "${phase6_staging_root}" != "${phase6_candidate_root}"
          rm -rf "${phase6_staging_root}"
          mkdir -p "${phase6_staging_root}/phase6"
          for evidence_file in \
            checklist.json \
            observations.json \
            N4-01.png \
            N4-02.png \
            N4-03.png \
            N4-04.png \
            attended-record.json
          do
            source_file="${phase6_source}/${evidence_file}"
            cp --no-dereference "${source_file}" "${phase6_staging_root}/phase6/${evidence_file}"
          done
          phase6_entry_count=0
          for phase6_entry in "${phase6_staging_root}/phase6"/* \
            "${phase6_staging_root}/phase6"/.[!.]* \
            "${phase6_staging_root}/phase6"/..?*
          do
            if [ ! -e "${phase6_entry}" ] && [ ! -L "${phase6_entry}" ]; then
              continue
            fi
            test -f "${phase6_entry}"
            test ! -L "${phase6_entry}"
            test "$(realpath "${phase6_entry}")" = "${phase6_entry}"
            size_bytes=$(wc -c < "${phase6_entry}" | tr -d '[:space:]')
            case "${size_bytes}" in ''|*[!0-9]*) exit 1 ;; esac
            test "${size_bytes}" -gt 0
            test "${size_bytes}" -le 67108864
            phase6_entry_count=$((phase6_entry_count + 1))
          done
          test "${phase6_entry_count}" -eq 7
          phase6_manifest_sha256=$(sha256sum "${phase6_candidate_root}/release-candidate.json" | awk '{print $1}')
          node workflow-source/scripts/generate-phase6-attended-checklist.mjs verify \
            --bundle-dir "${phase6_candidate_root}" \
            --manifest-sha256 "${phase6_manifest_sha256}" \
            --checklist "${phase6_staging_root}/phase6/checklist.json" \
            --observations "${phase6_staging_root}/phase6/observations.json" \
            --evidence-dir "${phase6_staging_root}/phase6" \
            --record "${phase6_staging_root}/phase6/attended-record.json"

      - name: Upload immutable human-authored evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.OBSERVATIONS_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/gym-tracker-human-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable Phase 6 N4 observation-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PHASE6_N4_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/gym-tracker-phase6-candidate/evidence/phase6-n4-upload
          if-no-files-found: error
          retention-days: 30
